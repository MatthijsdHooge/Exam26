<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 Cybersecurity Intro — AP Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080b;--panel:#0d0f14;--panel2:#141720;
  --border:#1a1f2e;--border2:#242b3d;
  --text:#dde3f0;--muted:#4a5568;--muted2:#6b7280;
  --c:#00d4ff;--correct:#22c55e;--wrong:#ef4444;--amber:#ffb800;--purple:#a855f7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(0,212,255,.05),transparent);pointer-events:none;z-index:0}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 80px;position:relative;z-index:1}

/* topbar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.back{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);background:transparent;border:1px solid var(--border2);padding:7px 14px;border-radius:4px;cursor:pointer;text-decoration:none;transition:all .15s;display:inline-block}
.back:hover{border-color:var(--muted);color:var(--text)}
.topic-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--c);border:1px solid;border-color:color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent);padding:5px 14px;border-radius:3px;margin-left:auto}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:7px;overflow:hidden;background:var(--panel);margin-bottom:16px}
.stat{text-align:center;padding:12px 0;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.sv{font-family:'IBM Plex Mono',monospace;font-size:1.3rem;font-weight:700;line-height:1;display:block}
.sl{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-top:3px;display:block}
.prog-wrap{height:3px;background:var(--border);border-radius:2px;margin-bottom:5px;overflow:hidden}
.prog{height:100%;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 70%,#fff));transition:width .5s ease;width:0;border-radius:2px}
.prog-txt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);text-align:right;margin-bottom:20px}

/* card */
.q-card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:32px 36px;margin-bottom:18px;animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.q-num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);border:1px solid color-mix(in srgb,var(--c) 25%,transparent);padding:3px 10px;border-radius:2px}
.q-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted2);background:var(--panel2);border:1px solid var(--border);padding:3px 10px;border-radius:2px}
.q-tbadge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 10px;border-radius:2px}
.tb-multi{color:var(--amber);background:rgba(255,184,0,.07);border:1px solid rgba(255,184,0,.2)}
.tb-open{color:var(--purple);background:rgba(168,85,247,.07);border:1px solid rgba(168,85,247,.2)}
.q-text{font-size:1.02rem;font-weight:500;line-height:1.65;margin-bottom:22px}

/* options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:13px;padding:12px 16px;border:1px solid var(--border);border-radius:5px;cursor:pointer;transition:border-color .12s,background .12s;background:var(--bg);user-select:none}
.opt:hover:not(.locked){border-color:var(--c);background:color-mix(in srgb,var(--c) 4%,transparent)}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,transparent)}
.opt.ok{border-color:var(--correct);background:rgba(34,197,94,.07)}
.opt.bad{border-color:var(--wrong);background:rgba(239,68,68,.07)}
.opt.missed{border-color:var(--amber);background:rgba(255,184,0,.06)}
.opt-box{width:18px;height:18px;flex-shrink:0;margin-top:2px;border:2px solid var(--border2);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .12s}
.opt.sel .opt-box{border-color:var(--c);background:var(--c);color:var(--bg)}
.opt.ok .opt-box{border-color:var(--correct);background:var(--correct);color:#fff}
.opt.bad .opt-box{border-color:var(--wrong);background:var(--wrong);color:#fff}
.opt.missed .opt-box{border-color:var(--amber);background:var(--amber);color:#000}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-top:3px;flex-shrink:0}
.opt-text{font-size:.92rem;line-height:1.5}

/* open */
.open-inp{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:5px;color:var(--text);padding:12px 16px;font-family:'IBM Plex Sans',sans-serif;font-size:.95rem;resize:none;transition:border-color .15s;margin-top:4px}
.open-inp:focus{outline:none;border-color:var(--c)}
.open-inp.ok{border-color:var(--correct);background:rgba(34,197,94,.07)}
.open-inp.bad{border-color:var(--wrong);background:rgba(239,68,68,.07)}

/* hint */
.hint-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--amber);background:rgba(255,184,0,.07);border:1px solid rgba(255,184,0,.2);padding:6px 14px;border-radius:4px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;margin-top:16px}
.hint-btn:hover{background:rgba(255,184,0,.13)}
.hint-box{margin-top:10px;padding:12px 16px;background:rgba(255,184,0,.06);border:1px solid rgba(255,184,0,.2);border-radius:5px;font-size:.88rem;line-height:1.6;color:var(--amber);display:none;animation:up .2s ease}
.hint-box.show{display:block}

/* feedback */
.feedback{margin-top:18px;padding:13px 18px;border-radius:5px;font-size:.88rem;line-height:1.6;display:none;animation:up .2s ease}
.feedback.show{display:block}
.fb-ok{background:rgba(34,197,94,.09);border:1px solid rgba(34,197,94,.3)}
.fb-bad{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.3)}

/* btns */
.btn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.btn{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:10px 22px;border-radius:4px;cursor:pointer;border:none;transition:all .15s}
.btn-check{background:var(--c);color:#07080b;font-weight:700}
.btn-check:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-1px)}
.btn-check:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;transform:none}
.btn-next{background:transparent;color:var(--c);border:1px solid var(--c)}
.btn-next:hover{background:color-mix(in srgb,var(--c) 8%,transparent)}
.btn-skip{background:transparent;color:var(--muted2);border:1px solid var(--border2)}
.btn-skip:hover{border-color:var(--muted);color:var(--text)}
.hidden{display:none!important}

/* score */
#score-screen{display:none;text-align:center;padding:60px 24px 100px;max-width:680px;margin:0 auto;position:relative;z-index:1}
.sc-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);padding:5px 16px;border-radius:2px;display:inline-block;margin-bottom:20px}
.sc-pct{font-family:'IBM Plex Mono',monospace;font-size:clamp(4rem,12vw,7rem);font-weight:700;line-height:1;margin:16px 0;color:var(--c)}
.sc-msg{font-size:1.05rem;color:var(--muted2);margin:12px 0 32px}
.sc-grid{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;margin:24px 0 40px}
.sc-item{text-align:center}
.sc-num{font-family:'IBM Plex Mono',monospace;font-size:2rem;font-weight:700;display:block}
.sc-lbl{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-top:3px;display:block}
.sc-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-home{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:13px 32px;border-radius:4px;cursor:pointer;font-weight:700;transition:all .15s;background:transparent;color:var(--c);border:1px solid var(--c);text-decoration:none;display:inline-block}
.btn-home:hover{background:color-mix(in srgb,var(--c) 8%,transparent)}
.btn-retry{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:13px 32px;border-radius:4px;cursor:pointer;font-weight:700;transition:all .15s;border:none;background:var(--c);color:#07080b}
.btn-retry:hover{filter:brightness(1.15);transform:translateY(-1px)}

@media(max-width:600px){
  .q-card{padding:20px 18px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:none}
  .stat:nth-child(3){border-right:1px solid var(--border)}
}
</style>
</head>
<body>

<div id="quiz-screen" class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← Terug</a>
    <span class="topic-pill">🔐 Cybersecurity Intro</span>
  </div>

  <div class="stats">
    <div class="stat"><span class="sv" id="sv-score" style="color:var(--correct)">0</span><span class="sl">Correct</span></div>
    <div class="stat"><span class="sv" id="sv-wrong" style="color:var(--wrong)">0</span><span class="sl">Fout</span></div>
    <div class="stat"><span class="sv" id="sv-left" style="color:var(--c)">—</span><span class="sl">Resterend</span></div>
    <div class="stat"><span class="sv" id="sv-pct" style="color:#a855f7">—</span><span class="sl">Score %</span></div>
  </div>
  <div class="prog-wrap"><div class="prog" id="prog"></div></div>
  <div class="prog-txt" id="prog-txt">Vraag 1 / —</div>

  <div id="q-container"></div>

  <div class="btn-row">
    <button class="btn btn-skip" id="btn-skip" onclick="skipQ()">Sla over</button>
    <button class="btn btn-check" id="btn-check" disabled onclick="check()">Controleer</button>
    <button class="btn btn-next hidden" id="btn-next" onclick="nextQ()">Volgende →</button>
  </div>
</div>

<div id="score-screen"></div>

<script>
window.QUESTIONS_cybersecurity = [

// ── LES 1 ─────────────────────────────────────────────────────────
{type:"open",t:"Les 1",q:"Leg uit wat Cybersecurity inhoudt en waarom het belangrijk is als student SNB/IOT om hiervoor te leren.",ans:["cybersecurity","beveiliging","beschermen","systemen","aanvallen","netwerk","snb","iot","beheer"],minMatch:2,h:"Denk aan: wat beschermt cybersecurity, wie is verantwoordelijk, en waarom is dit specifiek relevant voor iemand die netwerken en systemen beheert.",f:"Cybersecurity omvat alle technieken, processen en maatregelen om digitale systemen, netwerken en data te beschermen tegen aanvallen. Als SNB/IOT-student configureer en beheer je zelf die systemen — je bent de eerste verdedigingslijn. Kennis van beveiliging is beroepsessentieel."},

{type:"open",t:"Les 1",q:"Waarom is het onderwijs een interessant doelwit voor cyberaanvallen? Geef minstens drie redenen.",ans:["persoonsgegevens","beveiliging","bewustzijn","onderzoek","budget","open","netwerk","data","studenten"],minMatch:3,h:"Denk aan: wat bewaren scholen, hoe goed is de beveiliging doorgaans, en wie werkt/studeert er?",f:"(1) Rijke databronnen: persoonsgegevens van studenten/personeel + onderzoeksresultaten. (2) Zwakkere beveiliging: minder budget en expertise dan bedrijven. (3) Lager cyberbewustzijn bij gebruikers. (4) Waardevolle intellectuele eigendom. (5) Grote, open netwerken met veel BYOD-apparaten."},

{type:"open",t:"Les 1",q:"Wat wordt bedoeld met 'de identiteit van de gebruiker is de nieuwe perimeter' in moderne cybersecurity?",ans:["identiteit","perimeter","cloud","thuiswerken","zero trust","authenticatie","netwerk","grens","traditioneel"],minMatch:2,h:"Denk aan: hoe zag de traditionele netwerkgrens eruit, en wat veranderde er door cloud en thuiswerken?",f:"Vroeger was de perimeter de firewallgrens rond het kantoornetwerk. Nu werken mensen overal — thuis, cloud, mobiel. De traditionele grens bestaat niet meer. De identiteit (wie logt in, met welk apparaat, van waar) is het nieuwe controlepunt. Dit is de basis van Zero Trust: vertrouw niemand standaard, verifieer altijd."},

{type:"open",t:"Les 1",q:"Waarom is het belangrijk om op de hoogte te blijven van actuele cyberdreigingen? Noem een betrouwbare informatiebron.",ans:["evolueren","nieuw","kwetsbaarheden","cert","cisa","enisa","cve","dreigingen","patches","aanvallen"],minMatch:2,h:"Denk aan: hoe snel verandert het dreigingslandschap, en waar kun je betrouwbare info vinden?",f:"Het dreigingslandschap evolueert constant: nieuwe malware, zero-days en aanvalstechnieken verschijnen dagelijks. Wie niet bijhoudt wat actueel is, mist kritieke patches. Betrouwbare bronnen: CERT.be (Belgisch), CISA (Amerikaans), ENISA (Europees), CVE/NVD-database."},

{type:"open",t:"Les 1",q:"Leg het CIA-model uit en geef bij elk onderdeel een concreet voorbeeld.",ans:["confidentiality","integrity","availability","vertrouwelijkheid","integriteit","beschikbaarheid"],minMatch:3,h:"Drie letters, drie principes. Elk heeft een eigen type aanval dat het schendt.",f:"Confidentiality: alleen bevoegden hebben toegang. Voorbeeld: enkel artsen mogen patiëntdossiers inzien. Integrity: data is betrouwbaar en ongewijzigd. Voorbeeld: aanvaller past een transactiebedrag aan. Availability: systemen zijn bereikbaar wanneer nodig. Voorbeeld: DDoS-aanval maakt een webshop onbereikbaar."},

{type:"open",t:"Les 1",q:"Leg uit wat er bedoeld wordt met de stelling 'een cyberaanval hoeft niet altijd een technische impact te hebben'. Geef minstens 3 voorbeelden.",ans:["reputatie","financieel","juridisch","boete","vertrouwen","gdpr","imago","operationeel","schade"],minMatch:3,h:"Een aanval kan schade veroorzaken zonder dat ook maar één server crasht. Denk aan gevolgen voor imago, juridische consequenties en financiën.",f:"Niet-technische impacts: (1) Reputatieschade — klanten verliezen vertrouwen na een datalek. (2) Juridische gevolgen — GDPR-boete tot 4% van de wereldwijde omzet. (3) Financieel verlies — ransomware-losgeld of omzetderving. (4) Aansprakelijkheidsclaims van gedupeerden."},

// ── LES 2 ─────────────────────────────────────────────────────────
{type:"open",t:"Les 2",q:"Wat is de GDPR (AVG) en waarom werd deze wet op Europees niveau ingevoerd?",ans:["europese","verordening","persoonsgegevens","privacy","grondrecht","gefragmenteerd","harmoniseren","wet","bescherming"],minMatch:2,h:"Denk aan: wat regelt GDPR, wanneer trad het in werking, en waarom op Europees niveau?",f:"GDPR (General Data Protection Regulation) = Europese verordening van kracht sinds 2018 die de verwerking van persoonsgegevens regelt. Ingevoerd omdat privacy een Europees grondrecht is, nationale wetgeving te gefragmenteerd was en burgers meer controle verdienen over hun data."},

{type:"open",t:"Les 2",q:"Leg uit aan de hand van voorbeelden op wie de GDPR van toepassing is.",ans:["organisatie","bedrijf","school","ziekenhuis","eu","burgers","overheid","vzw","verwerkt"],minMatch:2,h:"GDPR is breder dan enkel commerciële bedrijven. Denk ook aan non-profit, overheid, en organisaties buiten de EU.",f:"GDPR geldt voor elke organisatie die persoonsgegevens verwerkt van EU-burgers: grote bedrijven, kleine zelfstandigen, scholen (leerlingendossiers), ziekenhuizen (patiëntdata), vzw's (ledenlijsten), overheidsinstellingen. Óók niet-Europese bedrijven die diensten aanbieden aan EU-burgers."},

{type:"open",t:"Les 2",q:"Leg het verschil uit tussen een betrokkene, een verwerkingsverantwoordelijke en een verwerker in het kader van GDPR.",ans:["betrokkene","verwerkingsverantwoordelijke","verwerker","doel","middelen","namens","verschil"],minMatch:3,h:"Drie rollen in de GDPR-keten. Van wie is de data, wie beslist, wie voert uit?",f:"Betrokkene = de persoon wiens persoonsgegevens worden verwerkt. Verwerkingsverantwoordelijke = bepaalt het doel en de middelen van verwerking (bijv. de school). Verwerker = externe partij die data verwerkt namens de verantwoordelijke (bijv. een cloud-provider)."},

{type:"open",t:"Les 2",q:"Wat zijn persoonsgegevens volgens de GDPR? Geef drie voorbeelden van gewone en bijzondere persoonsgegevens.",ans:["gewone","bijzondere","gezondheid","biometrisch","etnisch","naam","email","adres","persoonsgegevens"],minMatch:3,h:"Gewone persoonsgegevens identificeren iemand. Bijzondere categorieën (art. 9) zijn extra gevoelig.",f:"Gewone persoonsgegevens: naam, e-mailadres, IP-adres, rijksregisternummer. Bijzondere categorieën (extra bescherming): gezondheidsgegevens, biometrische identificatiegegevens, etnische afkomst, politieke opvattingen, seksuele geaardheid."},

{type:"open",t:"Les 2",q:"Welke rechten heeft een betrokkene volgens de GDPR? Beschrijf er vier.",ans:["inzage","wissing","overdraagbaarheid","bezwaar","beperking","verbetering","recht"],minMatch:4,h:"De GDPR geeft betrokkenen actieve rechten over hun eigen data. Ken er minstens vier.",f:"(1) Recht op inzage: weten welke data over jou verwerkt wordt. (2) Recht op wissing ('recht op vergetelheid'). (3) Recht op overdraagbaarheid: data ontvangen in machineleesbaar formaat. (4) Recht van bezwaar: bezwaar maken tegen verwerking. (5) Recht op beperking van de verwerking. (6) Recht op verbetering van onjuiste data."},

{type:"open",t:"Les 2",q:"Wat is OSINT en hoe kan dit worden misbruikt bij een cyberaanval?",ans:["open source intelligence","openbare bronnen","phishing","social engineering","shodan","linkedin","osint","profiel"],minMatch:2,h:"OSINT = informatie verzamelen via publiek beschikbare bronnen. Hoe gebruiken aanvallers dit als voorbereiding?",f:"OSINT (Open Source Intelligence) = informatie via openbaar toegankelijke bronnen: sociale media, bedrijfswebsites, Shodan, LinkedIn, HaveIBeenPwned. Misbruik: aanvallers bouwen een aanvalsprofiel voor gerichte phishing of social engineering — zonder technisch detecteerbaar te zijn."},

{type:"open",t:"Les 2",q:"Een hacker verzamelt via Shodan en HaveIBeenPwned informatie over een organisatie. Welke risico's ontstaan hierdoor en hoe kan GDPR hierdoor worden overtreden?",ans:["datalek","meldplicht","shodan","kwetsbaarheid","persoonsgegevens","72 uur","beveiliging","credential"],minMatch:2,h:"Shodan toont blootgestelde systemen. HaveIBeenPwned toont gelekte credentials. Combineer dit met GDPR-meldplicht.",f:"Shodan toont open poorten en misconfiguraties → aanvaller weet hoe in te breken. HaveIBeenPwned geeft gelekte credentials voor credential stuffing. GDPR: als de aanval leidt tot diefstal van persoonsgegevens = datalek → melden aan GBA binnen 72 uur. Blootgestelde systemen tonen ook onvoldoende beveiliging (GDPR art. 32)."},

{type:"open",t:"Les 2",q:"Een student ontdekt via OSINT dat zijn geboortedatum, school en sociale media vrij toegankelijk zijn. Hoe beoordeel je dit vanuit de GDPR en wat kan hij ondernemen?",ans:["privacy","recht","wissing","instellingen","aggregatie","persoonsgegevens","combineren","betrokkene"],minMatch:2,h:"Publieke data is toch persoonsdata. En gecombineerde data is gevaarlijker dan individuele elementen.",f:"Ook publiek beschikbare persoonsgegevens vallen onder GDPR. Gecombineerd vormen ze een gedetailleerd profiel (aggregatieprobleem). Acties: privacyinstellingen aanpassen, recht op wissing uitoefenen bij platformen, bewust zijn van wat je publiceert."},

{type:"open",t:"Les 2",q:"Stel: je organiseert een infosessie over GDPR op je school. Welke drie basisprincipes zou je zeker uitleggen?",ans:["doelbinding","minimale gegevensverwerking","verantwoordingsplicht","integriteit","vertrouwelijkheid","juistheid","principe","bewaring"],minMatch:3,h:"Kies drie principes die het meest relevant zijn voor een schoolpubliek.",f:"(1) Doelbinding: data enkel gebruiken voor het doel waarvoor ze verzameld is. (2) Minimale gegevensverwerking: niet meer data verzamelen dan nodig. (3) Verantwoordingsplicht: aantonen dat je GDPR naleeft via documentatie en processen."},

// ── LES 3 ─────────────────────────────────────────────────────────
{type:"open",t:"Les 3",q:"Wat is een cybersecurity framework en waarom gebruiken organisaties dit?",ans:["framework","richtlijnen","normen","risico","structuur","nist","iso","cyfun","beleid"],minMatch:2,h:"Een framework biedt structuur — maar het is geen technische tool. Waarom is structuur nuttig?",f:"Een cybersecurity framework = gestructureerd geheel van richtlijnen en best practices dat organisaties helpt beveiligingsrisico's te identificeren, beheren en communiceren. Gebruik: structuur in beveiligingsbeleid, prioritering van maatregelen, compliance aantonen (NIS2, GDPR)."},

{type:"open",t:"Les 3",q:"Wat is het verschil tussen een technisch en een governance framework? Geef van elk een concreet voorbeeld.",ans:["technisch","governance","cis","nist","iso","owasp","strategisch","operationeel","verschil"],minMatch:3,h:"Governance = strategie en beleid. Technisch = concrete implementatie. Denk aan bekende namen.",f:"Governance framework = strategisch kader voor risicobeheer en beleid. Voorbeelden: NIST CSF, ISO 27001. Technisch framework = concrete implementatierichtlijnen. Voorbeelden: CIS Benchmarks (OS-configuratie), OWASP (webapplicatiebeveiliging). Governance zegt WÁT en WAAROM, technisch zegt HOE."},

{type:"open",t:"Les 3",q:"Wat is het CyberFundamentals Framework van België en hoe verschilt het van internationale standaarden?",ans:["ccb","cyfun","belgisch","nis2","maturity","small","basis","belangrijk","essentieel","centre"],minMatch:2,h:"Wie heeft het gemaakt, voor wie is het bedoeld, en wat maakt het specifiek Belgisch?",f:"CyFun is uitgebracht door het CCB (Centre for Cybersecurity Belgium) met concrete maatregelen voor cyberweerbaarheid, afgestemd op NIS2. Vier maturity levels: Small, Basis, Belangrijk, Essentieel. Verschil: Belgische rechtscontext, rechtstreeks gekoppeld aan NIS2, gratis self-assessment tool."},

{type:"open",t:"Les 3",q:"Wat is de 'Cyber Kill Chain' en hoe kan deze worden gebruikt binnen cybersecurity?",ans:["kill chain","lockheed","fasen","reconnaissance","exploitatie","detecteren","onderbreken","aanval","delivery"],minMatch:2,h:"Denk aan de fasen van een aanval en hoe verdedigers dit model gebruiken.",f:"Cyber Kill Chain (Lockheed Martin): Reconnaissance → Weaponization → Delivery → Exploitation → Installation → C&C → Actions. Verdedigers bepalen in welke fase ze een aanval kunnen detecteren of onderbreken. Bijv. e-mailfilters stoppen Delivery, EDR pakt Exploitation aan."},

{type:"open",t:"Les 3",q:"Wat wordt er bedoeld met compliancy binnen cybersecurity? Bespreek aan de hand van voorbeelden.",ans:["compliancy","compliance","voldoen","norm","wet","iso","gdpr","nis2","aantonen","garantie"],minMatch:2,h:"Compliancy = aantonen dat je voldoet. Maar wat is het verschil met echt veilig zijn?",f:"Compliancy = aantonen dat een organisatie voldoet aan eisen van een norm, wet of framework. Voorbeelden: ISO 27001-certificering, NIS2-maatregelen implementeren. Belangrijk: compliance ≠ veiligheid. Een bedrijf kan compliant zijn maar toch zwakke wachtwoorden hebben."},

{type:"open",t:"Les 3",q:"Wat wordt er verstaan onder security controls? Welke soorten controls bestaan er? Leg uit aan de hand van voorbeelden.",ans:["controls","technisch","administratief","fysiek","firewall","beleid","badge","training","maatregel"],minMatch:3,h:"Security controls zijn maatregelen. Er zijn drie grote categorieën.",f:"Security controls = maatregelen die risico's verminderen. Drie soorten: (1) Technische controls: firewalls, encryptie, MFA, IDS. (2) Administratieve controls: beveiligingsbeleid, procedures, awareness training. (3) Fysieke controls: toegangsbadges, serversloten, camerabewaking."},

{type:"open",t:"Les 3",q:"Wat is het verschil en de link tussen wettelijke verplichting en compliancy in cybersecurity? Geef voorbeelden.",ans:["wet","verplichting","compliancy","gdpr","nis2","aantonen","bewijs","link","verschil"],minMatch:3,h:"Wet = de verplichting. Compliance = het bewijs dat je eraan voldoet.",f:"Wettelijke verplichting = je MOET iets doen (GDPR, NIS2 zijn wettelijk verankerd). Compliancy = aantonen dat je aan die verplichting voldoet via audits, documentatie, certificaten. Link: wetgeving stelt de eisen, frameworks (ISO 27001, CyFun) helpen die aantoonbaar te implementeren."},

{type:"open",t:"Les 3",q:"Wat is het MITRE ATT&CK-framework en hoe ondersteunt dit het herkennen van cyberaanvallen?",ans:["mitre","attck","tactics","techniques","procedures","ttp","blue team","detectie","kennisbank"],minMatch:2,h:"ATT&CK beschrijft hoe aanvallers te werk gaan. Hoe gebruiken verdedigers dit?",f:"MITRE ATT&CK = kennisbank van bekende Tactics (doelstellingen), Techniques (methodes) en Procedures. Blue teams mappen incidenten op ATT&CK-technieken om aanvallen te identificeren en detectieregels te verbeteren."},

{type:"open",t:"Les 3",q:"Een organisatie ontdekt dat gebruikers zich kunnen aanmelden op servers zonder MFA. Hoe koppel je dit aan een security framework en wat is een mogelijke mitigatie?",ans:["mfa","framework","nist","mitre","access control","identity","mitigatie","least privilege","authenticatie"],minMatch:2,h:"Koppel het probleem aan een framework-categorie en geef een concrete technische maatregel.",f:"NIST CSF PR.AC (Access Control): sterke authenticatie vereist. MITRE ATT&CK T1078 (Valid Accounts): aanvallers misbruiken geldige inloggegevens. Mitigaties: MFA verplicht stellen, least privilege toepassen, privileged access management implementeren."},

{type:"open",t:"Les 3",q:"Wat is STRIDE en hoe pas je dit model toe op een mobiele bankapplicatie?",ans:["stride","spoofing","tampering","repudiation","information disclosure","denial","elevation","threat modeling"],minMatch:3,h:"STRIDE = zes dreigingstypes. Pas elk toe op een bancaire mobiele app.",f:"STRIDE op bankapp: Spoofing=nep-loginscherm, Tampering=transactiebedrag wijzigen, Repudiation=betaling ontkennen zonder logging, Information Disclosure=saldo lekken, Denial of Service=app crashen, Elevation of Privilege=gewone gebruiker krijgt admin-rechten."},

// ── LES 4 ─────────────────────────────────────────────────────────
{type:"open",t:"Les 4",q:"Wat is het verschil tussen symmetrische en asymmetrische encryptie? Geef voor elk een toepassing.",ans:["symmetrisch","asymmetrisch","sleutel","aes","rsa","snelheid","sleuteldistributie","paar"],minMatch:3,h:"Één sleutel vs. sleutelpaar. Denk aan snelheid, veiligheid en het sleuteldistributieprobleem.",f:"Symmetrisch: één gedeelde sleutel, snel, voor grote hoeveelheden data. Probleem: veilige sleuteluitwisseling. Toepassing: AES voor bestandsversleuteling. Asymmetrisch: sleutelpaar (publiek+privaat), traag maar lost sleuteldistributie op. Toepassing: RSA/ECC voor TLS-handshake, digitale handtekeningen."},

{type:"open",t:"Les 4",q:"Wat is een hashfunctie? Waarvoor wordt ze gebruikt en waarom is ze belangrijk in digitale handtekeningen?",ans:["hash","vaste lengte","eenrichtingsverkeer","vingerafdruk","integriteit","handtekening","avalanche"],minMatch:2,h:"Hash = vaste output, eenrichtingsverkeer. Waarom onderteken je de hash en niet het bericht zelf?",f:"Hashfunctie = berekent een vaste-lengte vingerafdruk van data, niet omkeerbaar. In handtekeningen: de hash wordt ondertekend (niet de volledige data) voor efficiëntie. Ontvanger berekent zelf de hash en vergelijkt — efficiënt én integriteitsverificatie."},

{type:"open",t:"Les 4",q:"Wat is het verschil tussen een digitale handtekening en een MAC (Message Authentication Code)?",ans:["handtekening","mac","hmac","asymmetrisch","symmetrisch","non-repudiation","gedeelde sleutel","verschil"],minMatch:3,h:"Beide garanderen integriteit en authenticiteit — maar de sleuteltechnologie verschilt. En non-repudiation?",f:"Digitale handtekening: asymmetrisch, verifieerbaar door iedereen met publieke sleutel, biedt non-repudiation. MAC/HMAC: symmetrisch, gedeelde sleutel, geen non-repudiation (beide partijen konden het bericht aanmaken)."},

{type:"open",t:"Les 4",q:"Wat gebeurt er wanneer je een tekst hasht en vervolgens één teken wijzigt? Waarom is dit belangrijk?",ans:["avalanche","volledig","integriteit","detecteren","wijziging","hash","effect","onherkenbaar"],minMatch:2,h:"Eén teken wijzigen heeft een dramatisch effect op de hash. Hoe heet dit principe?",f:"Avalanche effect: één teken wijzigen → de hash verandert volledig en onherkenbaar. SHA-256 van 'hallo' vs 'Hallo' = totaal verschillende waarden. Dit maakt het onmogelijk data ongemerkt te wijzigen — elke aanpassing is detecteerbaar via de hash."},

{type:"open",t:"Les 4",q:"Waarom wordt ECB (Electronic Codebook) als onveilig beschouwd en welke alternatieven zijn veiliger?",ans:["ecb","identieke","patronen","cbc","gcm","herkennbaar","blok","cipher block chaining"],minMatch:2,h:"ECB versleutelt blokken onafhankelijk. Wat is het gevaar en hoe lossen alternatieven dit op?",f:"ECB: identieke plaintext-blokken → identieke ciphertext-blokken → patronen zichtbaar (ECB-penguin). Veiliger: CBC (elk blok XOR met vorig ciphertext-blok → patronen verbroken), GCM (encryptie + authenticatie in één, AEAD)."},

{type:"open",t:"Les 4",q:"Hoe werkt een digitale handtekening in de praktijk? Beschrijf de stappen van ondertekening tot verificatie.",ans:["hash","private sleutel","public sleutel","ondertekening","verificatie","vergelijken","stappen"],minMatch:3,h:"Zes stappen: drie bij de zender, drie bij de ontvanger.",f:"Ondertekening: (1) bereken hash van bericht, (2) versleutel hash met PRIVATE sleutel = handtekening, (3) stuur bericht + handtekening. Verificatie: (4) bereken zelf de hash, (5) ontsleutel handtekening met PUBLIEKE sleutel van zender, (6) vergelijk — als gelijk: authentiek en ongewijzigd."},

{type:"open",t:"Les 4",q:"Wat is de rol van randomness in cryptografie? Geef een voorbeeld van een toepassing en een risico bij slechte randomness.",ans:["willekeur","rng","csprng","sleutelgeneratie","voorspelbaar","debian","sessietoken","random"],minMatch:2,h:"Willekeur is de basis van cryptografische sterkte. Wat gaat er mis als de willekeur voorspelbaar is?",f:"Willekeur is fundamenteel voor sleutelgeneratie, IV/nonce, sessietokens. Slechte randomness = voorspelbare sleutels = breekbare encryptie. Voorbeeld: Debian OpenSSL-bug (2008) reduceerde het aantal mogelijke sleutels → SSH-sleutels brute-forceable. Gebruik altijd OS-gebaseerde CSPRNG."},

{type:"open",t:"Les 4",q:"Stel: je wil een bestand met gevoelige gegevens veilig verzenden naar je docent. Hoe garandeer je zowel vertrouwelijkheid als integriteit via symmetrische én asymmetrische cryptografie?",ans:["aes","rsa","hybride","symmetrisch","asymmetrisch","handtekening","versleutelen","sleutel"],minMatch:3,h:"Hybride encryptie combineert het beste van beide werelden. Beschrijf de stappen.",f:"Hybride aanpak: (1) Genereer willekeurige AES-sleutel. (2) Versleutel bestand met AES → vertrouwelijkheid. (3) Versleutel AES-sleutel met publieke RSA-sleutel van docent → veilige sleuteldistributie. (4) Onderteken hash met jouw private sleutel → integriteit + authenticiteit. Dit is hoe PGP en TLS werken."},

{type:"open",t:"Les 4",q:"Wat is een ciphersuite zoals TLS_RSA_WITH_AES_128_CBC_SHA en hoe beoordeel je of deze veilig is?",ans:["ciphersuite","tls","rsa","aes","cbc","sha","forward secrecy","pfs","ecdhe","algoritme"],minMatch:2,h:"Elke component staat voor een algoritme. Analyseer elk deel en kijk naar bekende zwakheden.",f:"TLS_RSA_WITH_AES_128_CBC_SHA: RSA=sleuteluitwisseling (geen PFS), AES-128=encryptie (aanvaardbaar), CBC=modus (kwetsbaar), SHA=MAC (zwak). Modern alternatief: ECDHE_RSA_WITH_AES_256_GCM_SHA384 — biedt PFS, GCM is AEAD, SHA-384 is sterk."},

{type:"open",t:"Les 4",q:"Waarom is een key derivation function belangrijk bij symmetrische encryptie?",ans:["kdf","pbkdf2","bcrypt","argon2","wachtwoord","brute force","rainbow table","salt","iteraties"],minMatch:2,h:"Wachtwoorden zijn slechte encryptiesleutels. Hoe maakt een KDF ze beter?",f:"KDF (bijv. PBKDF2, bcrypt, Argon2) leidt een sterke sleutel af via: salting (uniek per gebruiker → rainbow tables werken niet), hoge iteratiecount (traag voor aanvaller), geheugenintensief (Argon2). Resultaat: brute-force aanvallen onhaalbaar zelfs met GPU-clusters."},

// ── LES 5 ─────────────────────────────────────────────────────────
{type:"open",t:"Les 5",q:"Een leerling zegt dat hij 'tussen twee toestellen zit' en al het netwerkverkeer kan zien. Wat bedoelt hij hiermee en hoe werkt een klassieke Man-in-the-Middle aanval?",ans:["mitm","man in the middle","arp","poisoning","gateway","onderscheppen","ongemerkt","ip forwarding"],minMatch:2,h:"Denk aan hoe de aanvaller zijn positie inneemt en hoe hij onzichtbaar blijft.",f:"MitM: aanvaller plaatst zich tussen slachtoffer en gateway via ARP poisoning. Het slachtoffer denkt rechtstreeks te communiceren, maar alle pakketten passeren via de aanvaller. Met IP forwarding ingeschakeld stuurt hij het door — communicatie verloopt normaal maar hij ziet alles."},

{type:"open",t:"Les 5",q:"Leg uit wat het gevaar is van een MitM aanval en welke acties een aanvaller kan uitvoeren na het opzetten van een succesvolle aanval.",ans:["sniffing","hijacking","injecting","filtering","sessie","cookie","wachtwoord","ssl stripping","actie"],minMatch:3,h:"Vier klassieke acties die een aanvaller in MitM-positie kan uitvoeren.",f:"Na MitM-positie: (1) Sniffing: onversleuteld verkeer lezen (HTTP-wachtwoorden). (2) Hijacking: actieve sessies overnemen via gestolen cookies. (3) Injecting: kwaadaardige code toevoegen aan pagina's. (4) Filtering: HTTPS-redirects blokkeren (SSL stripping)."},

{type:"open",t:"Les 5",q:"Een leerling probeert ARP poisoning uit in een labo. Hoe werkt deze aanval en waarom is ARP zo kwetsbaar? Leg elke stap uit.",ans:["arp","mac","cache","valse reply","authenticatie","stateless","arpspoof","ip forwarding","stap"],minMatch:3,h:"ARP heeft een fundamenteel ontwerpprobleem. Beschrijf het stap voor stap.",f:"ARP-kwetsbaarheid: stateless protocol zonder authenticatie — iedereen kan valse replies sturen. Stappen: (1) Stuur valse ARP-reply naar slachtoffer: 'Gateway-IP heeft MAC van aanvaller'. (2) Stuur valse ARP-reply naar gateway: 'Slachtoffer-IP heeft MAC van aanvaller'. (3) Beide updaten hun ARP-cache. (4) Verkeer passeert via aanvaller. (5) IP forwarding inschakelen voor transparantie."},

{type:"open",t:"Les 5",q:"Tijdens het labo stelt een student een DNS spoofing-aanval in. Hoe werkt DNS spoofing en wat is het risico?",ans:["dns","spoofing","valse","ip","nep","phishing","dnsspoof","redirect","aanvaller"],minMatch:2,h:"Na een MitM-positie kan DNS-verkeer worden gemanipuleerd. Wat is het eindresultaat?",f:"DNS spoofing: na ARP poisoning passeert DNS-verkeer via de aanvaller. Met dnsspoof onderschept hij DNS-queries en antwoordt met valse IPs. Slachtoffer typt 'www.bank.be' → belandt op nep-website. Risico: credential harvesting, malware-distributie."},

{type:"open",t:"Les 5",q:"Tijdens een les meldt een student dat zijn laptop geen IP-adres meer ontvangt van het netwerk. Je vermoedt een aanval. Wat is DHCP starvation en hoe werkt dit?",ans:["dhcp","starvation","mac","pool","uitgeput","ip","request","discover","aanval"],minMatch:2,h:"DHCP-pool heeft een beperkte capaciteit. Wat doet een aanvaller om die uit te putten?",f:"DHCP starvation: aanvaller stuurt massaal DHCP DISCOVER-berichten met willekeurige MAC-adressen totdat de DHCP-pool uitgeput is. Nieuwe legitieme clients ontvangen geen IP meer (DoS). Combinatie: daarna start een rogue DHCP-server die valse DNS/gateway uitdeelt."},

{type:"open",t:"Les 5",q:"Hoe kan je DHCP starvation voorkomen in een schoolnetwerk?",ans:["dhcp snooping","port security","trusted","mac","beperken","switch","poort","maatregel"],minMatch:2,h:"Twee complementaire maatregelen op switch-niveau.",f:"(1) DHCP snooping: enkel de 'trusted' poort naar de legitieme DHCP-server mag OFFER/ACK sturen. Rogue DHCP-antwoorden geblokkeerd. (2) Port security: beperk het aantal MAC-adressen per poort — massale DHCP starvation met willekeurige MACs wordt geblokkeerd."},

{type:"open",t:"Les 5",q:"Je ontdekt dat een toestel op het netwerk zich voordoet als DHCP-server en verkeerde DNS-servers verspreidt. Hoe werkt zo'n rogue DHCP-aanval?",ans:["rogue dhcp","starvation","valse dns","gateway","mitm","clients","nep","server"],minMatch:2,h:"Twee fases: eerst de echte server uitschakelen, dan overnemen.",f:"Rogue DHCP in twee fases: (1) DHCP starvation: echte server uitputten. (2) Rogue DHCP-server starten: deelt IP-adressen uit mét valse DNS-servers en/of valse default gateway. Resultaat: alle clients sturen verkeer via de aanvaller → MitM-positie."},

{type:"open",t:"Les 5",q:"Hoe werkt DNSChef en wat is het verschil met DNS spoofing via ARP poisoning?",ans:["dnschef","dns proxy","rogue dhcp","intercepteren","query","valse antwoorden","verschil","server"],minMatch:2,h:"DNSChef is een DNS-server die je zelf opzet. Hoe verschilt dat van onderschepping via ARP?",f:"DNSChef = fake DNS-resolver op aanvallersmachine, configureerbaar per domein. Verschil: DNS spoofing via ARP poisoning intercepteert queries in transit (aanvaller is tussenpersoon). DNSChef fungeert als de DNS-server zelf (clients sturen queries rechtstreeks ernaar, bijv. via rogue DHCP)."},

// ── LES 6 ─────────────────────────────────────────────────────────
{type:"open",t:"Les 6",q:"Je wil voorkomen dat gebruikers op phishing sites terechtkomen. Noem minstens vier effectieve maatregelen.",ans:["spf","dkim","dmarc","mfa","training","dns filtering","bewustzijn","e-mailfilter","wachtwoordmanager"],minMatch:4,h:"Technische maatregelen (e-mail, DNS, MFA) én menselijke maatregelen (training).",f:"(1) SPF, DKIM en DMARC implementeren. (2) MFA: ook bij credential diefstal heeft aanvaller de tweede factor nodig. (3) Security awareness training + phishing-simulaties. (4) DNS-filtering: blokkeer bekende phishing-domeinen. (5) Wachtwoordmanager: vult enkel in op het echte domein."},

{type:"open",t:"Les 6",q:"Een student zegt: 'Sterke wachtwoorden volstaan niet tegen phishing.' Leg uit waarom dit klopt en hoe je inlogprocedures veiliger maakt.",ans:["phishing","wachtwoord","stelen","mfa","fido","authenticator","credential","nep","domein"],minMatch:2,h:"Phishing steelt het wachtwoord op het moment van invoer. Hoe bescherm je je dan?",f:"Phishing onderschept het wachtwoord bij invoer op een nep-site — sterkte is irrelevant. Oplossingen: (1) MFA/TOTP: aanvaller heeft tijdgebonden code nodig. (2) Hardware token FIDO2/WebAuthn: controleert het domein — werkt niet op nep-sites. (3) Wachtwoordmanager: herkent domein en vult niets in op nep-sites."},

{type:"open",t:"Les 6",q:"Wat is social engineering en welke technieken worden hierbij gebruikt? Geef minstens 3 voorbeelden.",ans:["social engineering","autoriteit","urgentie","vertrouwen","pretexting","phishing","manipulatie","nieuwsgierigheid"],minMatch:3,h:"Social engineering = de mens aanvallen. Welke psychologische triggers worden gebruikt?",f:"Social engineering = mensen manipuleren om informatie te geven of acties uit te voeren. Technieken: (1) Autoriteit: voordoen als IT-helpdesk of directeur. (2) Urgentie: 'Uw account wordt geblokkeerd!' (3) Vertrouwen: e-mail die lijkt van een bekende collega. (4) Pretexting: geloofwaardig verhaal verzinnen."},

{type:"open",t:"Les 6",q:"Wat is de link tussen phishing en GDPR en welke invloed heeft dit op bedrijven?",ans:["datalek","meldplicht","72 uur","gdpr","persoonsgegevens","boete","gba","preventie","verantwoordelijkheid"],minMatch:3,h:"Phishing steelt data → dat is een datalek → GDPR-verplichtingen treden in werking.",f:"Succesvolle phishing die persoonsgegevens comprometteert = GDPR-datalek. Bedrijven moeten: (1) Melden aan GBA binnen 72 uur. (2) Bij hoog risico ook betrokkenen informeren. (3) Preventieve maatregelen aantonen (GDPR art. 32). Boetes: tot 4% wereldwijde omzet."},

{type:"open",t:"Les 6",q:"Wat is spear phishing? Leg uit aan de hand van een concreet voorbeeld.",ans:["spear phishing","gericht","osint","gepersonaliseerd","linkedin","ceo fraude","specifiek","voorbeeld"],minMatch:2,h:"Spear phishing = maatwerk phishing. Gebruik OSINT als voorbereiding in je voorbeeld.",f:"Spear phishing = gerichte aanval op specifiek individu, gepersonaliseerd met OSINT. Voorbeeld: aanvaller ziet via LinkedIn dat Jan financieel directeur is → stuurt nep-e-mail van 'CFO' met urgent betalingsverzoek van €45.000. Geloofwaardig door personalisatie."},

{type:"open",t:"Les 6",q:"Leg uit hoe het gebruik van AI door het slachtoffer enerzijds en door de aanvaller anderzijds, de effectiviteit van phishing verhoogt.",ans:["ai","deepfake","prompt injection","copilot","spear phishing","taal","gepersonaliseerd","echoleak","aanvaller"],minMatch:2,h:"Twee kanten: hoe misbruiken aanvallers AI, en hoe worden AI-tools van slachtoffers misbruikt?",f:"Aanvaller gebruikt AI: perfecte gepersonaliseerde berichten op grote schaal, deepfakes voor CEO-fraude. Slachtoffer's AI wordt misbruikt: prompt injection via e-mailheaders (EchoLeak) → AI-assistent (Copilot) voert ongewenste acties uit zonder dat de gebruiker het ziet."},

{type:"open",t:"Les 6",q:"Hoe kan je voorkomen dat de AI van het slachtoffer misbruikt wordt tijdens phishing aanvallen? Geef minstens 3 maatregelen.",ans:["input sanitization","auto-fetch","sandbox","least privilege","isolatie","prompt injection","maatregel"],minMatch:3,h:"Focus op technische maatregelen om prompt injection en AI-misbruik te voorkomen.",f:"(1) Input sanitization: AI-assistenten mogen geen instructies uitvoeren uit e-mailinhoud. (2) Disable auto-fetch van externe content in e-mailclients. (3) Sandboxing/isolatie van AI-agents met beperkte rechten. (4) Least privilege voor LLM-scope: AI mag lezen maar niet automatisch handelen."},

// ── LES 7 ─────────────────────────────────────────────────────────
{type:"open",t:"Les 7",q:"Wat is het verschil tussen identificatie, authenticatie en authorisatie? Geef telkens een concreet voorbeeld.",ans:["identificatie","authenticatie","authorisatie","gebruikersnaam","wachtwoord","rechten","toegang","verschil"],minMatch:3,h:"Drie opeenvolgende stappen: claimen, bewijzen, en daarna bepalen wat je mag.",f:"Identificatie = claimen wie je bent (gebruikersnaam). Authenticatie = bewijzen wie je bent (wachtwoord + MFA). Autorisatie = bepalen wat je mag (arts ziet patiëntdossiers, receptionist alleen afspraken)."},

{type:"open",t:"Les 7",q:"Wat is Multi-Factor Authentication (MFA)? Geef een realistisch voorbeeld uit een ziekenhuiscontext.",ans:["mfa","factor","wachtwoord","badge","biometrie","have","know","are","ziekenhuis","authenticatie"],minMatch:3,h:"MFA = twee VERSCHILLENDE factoren. Wat zijn de factortypes en hoe past dit in een ziekenhuis?",f:"MFA = combinatie van twee+ VERSCHILLENDE factoren: iets wat je weet (PIN), hebt (badge/token), bent (biometrie), of waar je bent. Ziekenhuisvoorbeeld: verpleegkundige logt in met badge (have) + pincode (know) voor toegang tot het elektronisch patiëntendossier."},

{type:"open",t:"Les 7",q:"Geef een voorbeeld van een zwak wachtwoord en van een sterk wachtwoord. Leg uit waarom dit een zwak of sterk wachtwoord is.",ans:["zwak","sterk","lengte","willekeurig","persoonlijk","dictionary","brute force","osint","tekens"],minMatch:3,h:"Analyseer beide op basis van aanvalsmethoden: dictionary attack, OSINT, brute force.",f:"Zwak: 'Jan1990' — persoonlijk (OSINT), te kort, geen speciale tekens → dictionary attack in seconden. Sterk: 'X#7qL@mP2!vR9kNw' — lang (16+), willekeurig, mix van karaktertypes, uniek per platform → brute force onhaalbaar."},

{type:"open",t:"Les 7",q:"Wat is het verschil tussen DAC (Discretionary Access Control), MAC (Mandatory Access Control) en RBAC (Role-Based Access Control)? Geef telkens een voorbeeld.",ans:["dac","mac","rbac","eigenaar","label","rol","discretionary","mandatory","role-based","verschil"],minMatch:3,h:"Drie modellen, elk met een ander 'wie beslist over de toegang'.",f:"DAC: eigenaar beslist wie toegang krijgt (bijv. Windows NTFS-rechten). MAC: systeem beslist op basis van beveiligingslabels (bijv. overheid: SECRET-klaring). RBAC: rechten op basis van functierol (bijv. 'Arts' ziet patiëntdata, 'Receptionist' ziet afspraken)."},

{type:"open",t:"Les 7",q:"Je deelt een document in OneDrive met één collega. Hoe komt het dat een andere collega de link toch kan openen? Hoe vermijd je dit?",ans:["link","iedereen","specifieke personen","onedrive","sharing","aanmelding","toestemming","instellingen"],minMatch:2,h:"OneDrive heeft verschillende deeltypen. Welk type werd gebruikt en wat is de veiligste optie?",f:"De link is waarschijnlijk ingesteld als 'Iedereen met de link'. Oplossing: bij het delen kiezen voor 'Specifieke personen' + naam invullen + 'Aanmelding vereist'. Stel een vervaldatum in en verwijder de link na gebruik."},

{type:"open",t:"Les 7",q:"Een student voert een TryHackMe-oefening uit en merkt dat gebruikers hetzelfde wachtwoord hergebruiken. Wat is het risico en hoe voorkom je dit?",ans:["credential stuffing","hergebruik","wachtwoordmanager","mfa","uniek","risico","haveibeenpwned"],minMatch:2,h:"Als één service gehackt wordt en het wachtwoord hergebruikt is, wat kan een aanvaller dan doen?",f:"Risico: credential stuffing — als site A gehackt wordt en het wachtwoord uitgelekt is, proberen aanvallers het automatisch op andere sites. Preventie: (1) Wachtwoordmanager genereert unieke wachtwoorden. (2) MFA: ook bij diefstal is de tweede factor nodig."},

{type:"open",t:"Les 7",q:"Wat is accountability in cybersecurity? Waarom is dit belangrijk, vooral in werkomgevingen met gevoelige data?",ans:["accountability","logging","audit","herleidbaar","verantwoording","forensisch","fraude","non-repudiation"],minMatch:2,h:"Accountability = elke actie is herleidbaar naar een persoon. Waarom is dit cruciaal?",f:"Accountability = aantoonbaar maken wie welke actie heeft uitgevoerd via logging en auditing. Belang: (1) Forensisch onderzoek bij incidenten. (2) Fraudedetectie. (3) GDPR-compliance: aantonen wie toegang had tot persoonsgegevens. (4) Juridisch bewijs."},

{type:"open",t:"Les 7",q:"Wat is het verschil tussen auditing, logging en monitoring? Geef van elk een korte uitleg en een voorbeeld.",ans:["logging","monitoring","auditing","realtime","periodiek","siem","zabbix","firewall","verschil"],minMatch:3,h:"Drie begrippen met elk een eigen tijdshorizon en doel.",f:"Logging = continu vastleggen van events. Voorbeeld: firewall-logs, aanmeldlogs. Monitoring = realtime observatie en alerting bij afwijkingen. Voorbeeld: Zabbix, SIEM. Auditing = periodieke, doelgerichte analyse van logs. Voorbeeld: ISO 27001-audit, post-incident forensisch onderzoek."},

// ── LES 8 ─────────────────────────────────────────────────────────
{type:"open",t:"Les 8",q:"Wat is het verschil tussen een packet filtering firewall en een applicatie firewall? Wat is het gevolg voor de functionaliteiten van deze firewalls?",ans:["packet filtering","applicatie firewall","laag","header","inhoud","waf","http","sql injection","xss","verschil"],minMatch:3,h:"Twee firewalls werken op verschillende OSI-lagen. Wat kunnen ze wel en niet detecteren?",f:"Packet filtering (laag 3/4): inspecteert IP-headers en poortnummers — snel maar blind voor applicatie-inhoud, kan geen SQL injection detecteren. Applicatiefirewall/WAF (laag 7): begrijpt HTTP, herkent aanvalspatronen. Kan SQL injection in URL-parameters blokkeren maar is trager."},

{type:"open",t:"Les 8",q:"Tijdens een netwerkcontrole ontdek je dat studenten vanaf het LAN ongewenste websites zoals hln.be kunnen bezoeken. Hoe stel je dit bij via firewallregels in PFSENSE?",ans:["pfsense","firewall","rule","lan","blokkeer","poort","pfblocker","squid","url filtering","regel"],minMatch:2,h:"Twee aanpakken: IP-gebaseerde regels of domein-gebaseerde filtering via een proxy of plugin.",f:"Aanpak 1: Firewall → Rules → LAN → Block-regel voor IP van hln.be op poort 80/443. Aanpak 2: pfBlockerNG (DNS-gebaseerde blokkering) of Squid proxy + SquidGuard (categorie-filtering). Beter schaalbaar dan IP-gebaseerde regels."},

{type:"open",t:"Les 8",q:"Wat is een DMZ en wanneer wordt deze toegepast? Leg uit aan de hand van minstens 2 voorbeelden.",ans:["dmz","demilitarized zone","firewall","publiek","intern","webserver","mailserver","scheiding","netwerk"],minMatch:3,h:"Een DMZ is een tussenzone. Waarom is die scheiding nuttig bij publiek toegankelijke servers?",f:"DMZ = netwerksegment tussen internet en intern netwerk, begrensd door twee firewalls. Voorbeeld 1: bedrijfswebserver in DMZ — klanten bereiken die, intern netwerk niet. Voorbeeld 2: mailserver in DMZ — ontvangt mail van buiten, interne servers afgeschermd."},

{type:"open",t:"Les 8",q:"Een collega vraagt of jullie firewall 'stateful' is. Hoe leg je dit uit en waarom is dit belangrijk bij pakketinspectie?",ans:["stateful","stateless","verbindingsstatus","connection tracking","tcp","sessie","return traffic","pakket"],minMatch:2,h:"Stateful = de firewall onthoudt verbindingen. Waarom is dat beter?",f:"Stateful firewall houdt verbindingsstatus bij: weet of een pakket deel is van een bestaande legitieme verbinding. Inkomende pakketten die niet tot een actieve sessie behoren worden geblokkeerd. Stateless bekijkt enkel IP/poort onafhankelijk — vereist expliciete regels voor return-verkeer."},

{type:"open",t:"Les 8",q:"Wat is 'defense in depth' en waarom wordt dit toegepast binnen cybersecurity? Leg uit aan de hand van een voorbeeld.",ans:["defense in depth","lagen","gelaagd","single point of failure","firewall","encryptie","mfa","detectie","verdediging"],minMatch:2,h:"Geen enkel beveiligingsproduct is perfect. Hoe bouw je een systeem dat meerdere faalmomenten kan opvangen?",f:"Defense in depth = meerdere beveiligingslagen zodat aanvaller alle lagen moet doorbreken. Geen SPOF. Lagen: fysiek (badge), netwerk (firewall, VLAN), host (EDR, patches), applicatie (WAF), data (encryptie), gebruiker (MFA, training). Voorbeeld: firewall doorbroken → stuit op segmentatie → stuit op MFA."},

{type:"open",t:"Les 8",q:"Wat is een reverse proxy en welke voordelen biedt deze?",ans:["reverse proxy","load balancing","tls","verbergen","cache","waf","nginx","haproxy","voordeel"],minMatch:2,h:"Een reverse proxy staat voor de servers. Wat doet die voor de servers en de clients?",f:"Reverse proxy staat voor webservers. Voordelen: (1) Verbergt interne serverarchitectuur. (2) Load balancing. (3) TLS-terminatie/offloading. (4) Caching van statische content. (5) WAF-integratie. Verschil forward proxy: forward beschermt clients, reverse beschermt servers."},

{type:"open",t:"Les 8",q:"Leg uit wat er wordt verstaan onder een 'honeypot' binnen cybersecurity. Wat zijn redenen om dit niet toe te passen op een netwerk?",ans:["honeypot","lokken","aanvaller","observeren","juridisch","doorbraak","risico","springplank"],minMatch:2,h:"Honeypot = lokaas. Wat zijn de gevaren als de aanvaller de honeypot doorbreekt?",f:"Honeypot = bewust kwetsbaar systeem om aanvallers te bestuderen. Redenen om NIET toe te passen: (1) Juridische risico's (aansprakelijkheid). (2) Als gecompromitteerd → springplank naar intern netwerk. (3) Hoge onderhoudslast. (4) False sense of security."},

// ── LES 9 ─────────────────────────────────────────────────────────
{type:"open",t:"Les 9",q:"Wat is een vulnerability, hoe wordt dit veroorzaakt en hoe kan je dit oplossen? Leg uit aan de hand van een voorbeeld.",ans:["vulnerability","kwetsbaarheid","programmeer","ontwerp","patch","cve","exploit","verouderd","oplossing"],minMatch:2,h:"Vulnerability = onbedoelde zwakheid. Hoe ontstaat die en hoe verhelp je ze?",f:"Vulnerability = kwetsbaarheid die misbruikt kan worden. Oorzaken: programmeerfouten (buffer overflow, SQL injection), ontwerpfouten, verouderde componenten, misconfiguratie. Oplossingen: patchen, vulnerability scanning (Nessus), code review, OS hardening, penetratietest."},

{type:"open",t:"Les 9",q:"Wat is het verschil tussen client-side attacks en server-side attacks? Geef van elk 2 voorbeelden.",ans:["client-side","server-side","xss","csrf","sql injection","command injection","browser","server","verschil"],minMatch:3,h:"Client-side = aanval op de browser. Server-side = aanval op de server-infrastructuur.",f:"Client-side (aanval op browser): XSS (kwaadaardig script in browser slachtoffer), CSRF (browser voert ongewenst verzoek uit). Server-side (aanval op server): SQL injection (database manipuleren), command injection (OS-commando's uitvoeren op server)."},

{type:"open",t:"Les 9",q:"Wat wordt er verstaan onder 'OS hardening' en waarom is dit belangrijk binnen cybersecurity?",ans:["hardening","aanvalsoppervlakte","onnodige","services","software","verkleinen","kwetsbaarheden","beveiliging"],minMatch:2,h:"Hardening = verkleinen van de aanvalsoppervlakte. Waarom is een standaard OS-installatie onveilig?",f:"OS hardening = aanvalsoppervlakte verkleinen door alles te verwijderen of uitschakelen wat niet nodig is. Belang: standaard installaties hebben onnodige services actief. Elke actieve service = extra aanvalsvector. Hardening reduceert drastisch het aantal potentiële kwetsbaarheden."},

{type:"open",t:"Les 9",q:"Leg uit hoe je met OS hardening aan de slag kan. Welke acties kan je ondernemen?",ans:["services","accounts","firewall","patches","auditlogging","cis","appLocker","schijfencryptie","wachtwoord","uitschakelen"],minMatch:3,h:"Geef concrete acties op systeem-, account-, netwerk- en applicatieniveau.",f:"OS hardening: (1) Onnodige services/software uitschakelen. (2) Default accounts hernoemen/uitschakelen. (3) Sterke wachtwoordpolicies + MFA. (4) Firewall, enkel noodzakelijke poorten. (5) Patch management. (6) Auditlogging inschakelen. (7) CIS Benchmarks als referentie. (8) AppLocker voor software whitelisting."},

{type:"open",t:"Les 9",q:"Wat is EDR en hoe werkt dit?",ans:["edr","endpoint detection","gedragsanalyse","machine learning","isoleren","antivirus","process","response","agent"],minMatch:2,h:"EDR gaat verder dan traditionele antivirus. Hoe detecteert het onbekende bedreigingen?",f:"EDR = Endpoint Detection and Response. Agent op elk endpoint monitort continu alle activiteiten. Detectie via gedragsanalyse: bijv. Word.exe dat PowerShell spawnt = verdacht. Reactie: geautomatiseerd isoleren, kill process, alert voor SOC. Verschil met AV: AV = signatures, EDR = gedragspatronen."},

{type:"open",t:"Les 9",q:"Wat zijn CIS Benchmarks en hoe kunnen deze worden gebruikt binnen cybersecurity?",ans:["cis","benchmarks","configuratie","hardening","compliance","windows","linux","cloud","niveau","center"],minMatch:2,h:"CIS Benchmarks = de gouden standaard voor OS-configuratie. Hoe gebruik je ze?",f:"CIS Benchmarks = gedetailleerde configuratierichtlijnen per OS/applicatie (Windows, Linux, cloud). Niveau 1 (minimale impact) en niveau 2 (hogere beveiliging). Gebruik: als baseline voor hardening, compliance-audits (NIS2, ISO 27001), geautomatiseerd via OpenSCAP. Gratis, community-gedreven."},

{type:"open",t:"Les 9",q:"Leg uit hoe je het gebruik van tools zoals openSCAP zou introduceren in een bestaande omgeving en wat hiervan de beperkingen zijn.",ans:["openscap","audit","remediation","productie","false positive","profiel","scan","beperkingen","manueel"],minMatch:2,h:"Introduceer stap voor stap, begin met meten. Wat zijn de valkuilen?",f:"Introductie: (1) Begin in audit-modus (scannen, niets wijzigen). (2) Kies een profiel (bijv. CIS Level 1). (3) Prioriteer bevindingen op risico. (4) Test remediation buiten productie. (5) Rollout met change management. Beperkingen: false positives, legacy systemen niet ondersteund, manuele tussenkomst nodig voor herstel."},

// ── LES 10 ────────────────────────────────────────────────────────
{type:"open",t:"Les 10",q:"Bespreek minstens 3 dreigingen die zich kunnen voordoen bij mobiele apparaten.",ans:["malware","wifi","verlies","diefstal","rooting","jailbreak","phishing","smishing","outdated","bedreiging"],minMatch:3,h:"Denk aan hardware-bedreigingen (verlies), netwerk-bedreigingen en software-bedreigingen.",f:"(1) Malware via niet-officiële app stores. (2) Onbeveiligde wifi: MitM via rogue access points. (3) Verlies/diefstal: onversleutelde data toegankelijk. (4) Rooting/jailbreaking: omzeilt OS-sandboxing. (5) Smishing: minder gefilterd dan e-mail. (6) Verouderd OS: patches ontbreken."},

{type:"open",t:"Les 10",q:"Bespreek minstens 3 dreigingen die zich kunnen voordoen bij IoT toestellen.",ans:["default credentials","update","communicatie","mirai","botnet","onversleuteld","firmware","iot","dreiging"],minMatch:3,h:"IoT-toestellen hebben specifieke beperkingen. Welke beveiligingsproblemen zijn inherent?",f:"(1) Default credentials (admin/admin) nooit gewijzigd → Mirai botnet. (2) Geen/zelden updates → kwetsbaarheden blijven jaren bestaan. (3) Onversleutelde communicatie (HTTP, MQTT zonder TLS). (4) Grote aanvalsoppervlakte. (5) Beperkte verwerkingscapaciteit voor beveiliging."},

{type:"open",t:"Les 10",q:"Bespreek de voor- en nadelen van BYOD en noem minstens 2 alternatieven.",ans:["byod","voordeel","nadeel","kostenbesparing","beveiliging","cyod","cope","cobo","privacy","mdm"],minMatch:3,h:"BYOD biedt kostenbesparing maar creëert beveiligingsproblemen. Welke alternatieven bieden meer controle?",f:"BYOD voordelen: kostenbesparing, vertrouwde toestellen. Nadelen: mix privé/zakelijk, moeilijk MDM, privacy-issues, data-leakage risico. Alternatieven: CYOD (keuze uit goedgekeurde lijst), COPE (bedrijfstoestel, beperkt privégebruik), COBO (enkel zakelijk)."},

{type:"open",t:"Les 10",q:"Wat is het verschil tussen MDM en MAM? Wanneer kies je voor welke oplossing?",ans:["mdm","mam","toestel","applicatie","byod","container","remote wipe","privacy","verschil"],minMatch:3,h:"MDM beheert het volledige toestel, MAM enkel de zakelijke apps.",f:"MDM (Mobile Device Management) = volledig toestelbeheer: remote wipe, encryptie, app-controle. Invasief bij BYOD. MAM (Mobile Application Management) = enkel zakelijke app-container beveiligen, privédata ongemoeid. Keuze: bedrijfstoestel → MDM. BYOD → MAM."},

{type:"open",t:"Les 10",q:"Wat is conditional access en hoe breng je dit in verband met MDM?",ans:["conditional access","voorwaarden","mdm","compliant","locatie","rol","microsoft","intune","entra","policy"],minMatch:2,h:"Conditional access = toegang op basis van voorwaarden. Hoe werkt de koppeling met MDM-compliance?",f:"Conditional access = toegang enkel als aan voorwaarden voldaan is: toestel MDM-geregistreerd en compliant (encryptie aan, gepatcht), gebruikersrol, locatie. MDM rapporteert compliance aan de policy. Niet-compliant toestel → toegang geweigerd. Voorbeeld: Microsoft Intune + Entra ID Conditional Access."},

{type:"open",t:"Les 10",q:"Bespreek minstens 2 beveiligingsmaatregelen die belangrijk zijn bij het uitrollen en gebruiken van IoT toestellen.",ans:["credentials","default","vlan","segmentatie","firmware","updates","inventaris","monitoring","maatregel"],minMatch:2,h:"Denk aan zowel de installatiefase als het doorlopend beheer van IoT-toestellen.",f:"(1) Wijzig alle default credentials: fabriekswachtwoorden zijn publiek gekend. (2) Netwerksegmentatie: IoT in apart VLAN, gescheiden van productie. (3) Firmware-updates: plan regelmatige updates. (4) Schakel onnodige functies uit (Telnet, UPnP)."},

{type:"open",t:"Les 10",q:"Wanneer kies je voor BYOD, CYOD, COPE of COBO?",ans:["byod","cyod","cope","cobo","security","controle","kost","sector","overheid","startup"],minMatch:2,h:"Elk model biedt een andere balans tussen kostprijs, controle en vrijheid.",f:"BYOD: laagste kost/controle, startups. CYOD: keuze uit goedgekeurde toestellen, balans vrijheid/controle. COPE: bedrijf koopt en configureert, beperkt privégebruik, gezondheidszorg. COBO: volledig zakelijk, hoogste controle, overheid/defensie."},

// ── LES 11 ────────────────────────────────────────────────────────
{type:"open",t:"Les 11",q:"Wat wordt bedoeld met het concept 'cyberweerbaarheid' en waarom is dit belangrijk?",ans:["cyberweerbaarheid","weerstaan","herstellen","detecteren","reageren","continuïteit","preventie","aanval"],minMatch:2,h:"Cyberweerbaarheid gaat verder dan enkel preventie. Wat zijn de vier componenten?",f:"Cyberweerbaarheid = vermogen om aanvallen te weerstaan, detecteren, reageren én herstellen — 100% preventie is onmogelijk. Componenten: Anticipate (risico's voorzien), Withstand (impact beperken), Recover (snel herstellen), Adapt (leren en verbeteren)."},

{type:"open",t:"Les 11",q:"Wat is het verschil tussen een incident response plan, een business continuity plan en een disaster recovery plan? Leg uit aan de hand van een voorbeeld.",ans:["incident response","business continuity","disaster recovery","irp","bcp","drp","verschil","herstel"],minMatch:3,h:"Drie plannen, elk met een andere scope en focus.",f:"IRP: reactie op beveiligingsincident (detectie, indamming, eradicatie). BCP: hoe blijven kritische bedrijfsprocessen werken — breder dan IT. DRP: hoe herstellen we IT-systemen — onderdeel van BCP. Ransomware voorbeeld: IRP isoleert, DRP herstelt servers, BCP laat medewerkers doorwerken."},

{type:"open",t:"Les 11",q:"Bespreek minstens 3 aspecten die voorkomen in een incident response plan.",ans:["rollen","detectie","indamming","eradicatie","herstel","communicatie","post-incident","escalatie","aspect"],minMatch:3,h:"Een IRP beschrijft wat je doet vóór, tijdens en na een incident.",f:"(1) Rollen en verantwoordelijkheden: IR-lead, communicatiemanager. (2) Detectie en analyse: hoe herken je een incident, severity-classificatie. (3) Indamming: isoleer geïnfecteerd systeem. (4) Eradicatie en herstel: verwijder malware, patch, restore. (5) Communicatieplan: intern en extern. (6) Post-incident review."},

{type:"open",t:"Les 11",q:"Wat wordt er verstaan onder RTO en RPO?",ans:["rto","rpo","recovery time objective","recovery point objective","downtime","dataverlies","back-up","herstel"],minMatch:2,h:"Twee afkortingen: één over tijd, één over data.",f:"RTO (Recovery Time Objective) = maximaal aanvaardbare downtime. 'Hoe snel hersteld?' RPO (Recovery Point Objective) = maximaal aanvaardbaar dataverlies. 'Hoeveel data mogen we verliezen?' Voorbeeld: RTO=4u → herstel binnen 4u. RPO=2u → back-up minstens elke 2u."},

{type:"open",t:"Les 11",q:"Leg de 3-2-1 regel uit bij back-up strategieën. Waarom is deze regel belangrijk?",ans:["3-2-1","drie kopieën","twee media","één offsite","ransomware","cloud","back-up","air-gapped"],minMatch:2,h:"Drie getallen, drie regels. Waarom is de offsite-kopie zo cruciaal?",f:"3-2-1: 3 kopieën, op 2 verschillende opslagmedia, waarvan 1 offsite. Belang: (1) Ransomware versleutelt lokale back-ups → offsite overleeft. (2) Brand/overstroming vernietigt lokale opslag → offsite overleeft. Uitbreiding: 3-2-1-1-0 met extra air-gapped kopie + verificatie."},

{type:"open",t:"Les 11",q:"Leg volgende begrippen uit: CISO, SOC, Blue Team en Red Team.",ans:["ciso","soc","blue team","red team","chief information security","security operations","verdediging","aanval"],minMatch:4,h:"Vier rollen in een beveiligingsorganisatie.",f:"CISO: eindverantwoordelijke voor informatiebeveiliging, strategisch. SOC: 24/7 monitoring en reactie op incidenten (SIEM, IDS). Blue Team: dagelijkse verdediging — patching, monitoring, IRP. Red Team: ethische aanvallers die kwetsbaarheden simuleren. Purple Team: Red + Blue werken samen."},

{type:"open",t:"Les 11",q:"Bespreek de 3 manieren waarop aan recovery kan worden gedaan.",ans:["cold","warm","hot","site","rto","kost","back-up","replicatie","herstel"],minMatch:3,h:"Drie niveaus van herstelcapaciteit, elk met een eigen balans tussen kosten en herstelsnelheid.",f:"Cold site: lege ruimte, alles installeren vanuit back-up. RTO = uren/dagen, laagste kost. Warm site: infrastructuur aanwezig, recente back-ups geladen. RTO = uren, gemiddelde kost. Hot site: identieke omgeving, real-time gerepliceerd. RTO = minuten, hoogste kost."},

// ── LES 12 ────────────────────────────────────────────────────────
{type:"open",t:"Les 12",q:"Wat zijn de stappen om een security assessment uit te voeren?",ans:["scoping","planning","scanning","reconnaissance","exploitatie","rapportage","remediation","hervalidatie","stap"],minMatch:3,h:"Een security assessment volgt een gestructureerd proces.",f:"(1) Scoping & planning: scope bepalen, schriftelijke toestemming. (2) Information gathering: OSINT, Shodan. (3) Vulnerability scanning: Nessus, OpenVAS. (4) Exploitatie (enkel bij pentest met toestemming). (5) Rapportage: bevindingen, CVSS, aanbevelingen. (6) Remediation support. (7) Hervalidatie na fixes."},

{type:"open",t:"Les 12",q:"Wat is het verschil tussen vulnerability assessment, penetration testing en audit en logging?",ans:["vulnerability assessment","penetration testing","audit","logging","automatisch","manueel","exploitatie","compliance","verschil"],minMatch:3,h:"Drie methoden met elk een ander doel en diepgang.",f:"VA: automatisch kwetsbaarheden identificeren zonder exploitatie (breed, snel). Pentest: manuele exploitatie om impact aan te tonen (diep, gesimuleerde aanvaller, vereist toestemming). Audit & logging: processen en configuraties controleren voor compliance (geen technische aanval)."},

{type:"open",t:"Les 12",q:"Is een hoge CVE score direct ook een hoog risico voor het bedrijf? Verklaar je nader.",ans:["cvss","context","gebruik","risico","niet gelijk","netwerksegmentatie","extern","intern","mitigatie"],minMatch:2,h:"CVSS geeft technische ernst, maar risico is context-afhankelijk.",f:"Nee, hoge CVSS ≠ automatisch hoog risico. Risico = kans × impact in context. Risicoverlagende factoren: (1) Software niet in gebruik. (2) Systeem niet extern bereikbaar. (3) Compenserende maatregelen aanwezig (WAF, IDS). Voorbeeld: CVSS 10.0 in niet-geïnstalleerde software = risico 0."},

{type:"open",t:"Les 12",q:"Wat houdt scoping en planning in bij een security assessment?",ans:["scope","planning","toestemming","ip","systemen","tijdvenster","rules of engagement","escalatie","schriftelijk"],minMatch:3,h:"Zonder goede scoping is een pentest illegaal. Wat moet er vastgelegd worden?",f:"Scoping = wat IN scope (IP-ranges, applicaties, testmethoden) en wat BUITEN scope. Planning = tijdvenster, testmethode (black/grey/white box), escalatieprocedures, noodstopplan. Essentieel: schriftelijke toestemming (Rules of Engagement). Zonder dit = ongeautoriseerde toegang = strafbaar."},

{type:"open",t:"Les 12",q:"Wat is een false positive? Wat is een false negative? Geef een voorbeeld ivm een NESSUS scanner.",ans:["false positive","false negative","nessus","kwetsbaarheid","gemist","fout","scanner","voorbeeld"],minMatch:3,h:"Twee types fouten: de scanner meldt iets dat er niet is, of mist iets dat er wel is.",f:"False positive: scanner rapporteert kwetsbaarheid die er niet is. Voorbeeld Nessus: detecteert verouderde OpenSSL op basis van de banner terwijl het intern al gepatcht is → onnodige paniek. False negative: scanner mist een kwetsbaarheid. Voorbeeld: Nessus detecteert geen complexe multi-step SQL injection → vals gevoel van veiligheid."},

{type:"open",t:"Les 12",q:"Wat is het doel van een pentest en wat is zeker niet het doel? Verklaar.",ans:["pentest","doel","kwetsbaarheden","aantonen","niet vernietigen","niet stelen","toestemming","schade","rapport"],minMatch:2,h:"Wat wil je aantonen en wat zijn de grenzen van een pentest?",f:"Doel: kwetsbaarheden opsporen en reële impact aantonen via gecontroleerde exploitatie, met toestemming. Resultaat: rapport met bevindingen en aanbevelingen. ZEKER NIET: data stelen/vernietigen, systemen beschadigen buiten scope, permanente toegang behouden, buiten tijdvenster werken."},

{type:"open",t:"Les 12",q:"Wat is een risico matrix? Vertel hoe die tot stand komt en hoe je die gebruikt.",ans:["risico","matrix","kans","impact","prioriteit","hoog","medium","laag","behandelen","visualiseren"],minMatch:3,h:"Een risico matrix combineert twee dimensies. Hoe stel je die op en hoe gebruik je ze?",f:"Risico matrix: kans × impact. Tot stand komen: (1) Identificeer risico's via VA of threat modeling. (2) Scoor op kans (laag/medium/hoog) en impact. (3) Plot op de matrix. Gebruik: hoog risico = onmiddellijk aanpakken. Laag risico = accepteren of monitoren. Prioriteert beveiligingsinvesteringen."},

{type:"open",t:"Les 12",q:"Welke aspecten zijn belangrijk in een goede rapportage van een security assessment/pentest?",ans:["executive summary","technisch","bevindingen","aanbevelingen","cvss","prioriteit","reproductie","management","stappen"],minMatch:3,h:"Een rapport heeft twee publiken: management en technici. Wat heeft elk nodig?",f:"Goede pentest-rapportage: (1) Executive Summary voor management (grote risico's, gevolgen). (2) Scope en methodologie. (3) Bevindingen per kwetsbaarheid: beschrijving, CVSS-score, reproductiestappen, bewijs. (4) Risicoklassificatie (kritiek/hoog/medium/laag). (5) Concrete aanbevelingen. (6) Remediatieplan met prioritering."},

{type:"open",t:"Les 12",q:"Wat is een zero-day vulnerability? Hoe ga je te werk tegen een zero-day vulnerability?",ans:["zero-day","patch","onbekend","exploit","mitigatie","monitoring","threat intelligence","defence in depth"],minMatch:2,h:"Zero-day = geen patch beschikbaar. Wat doe je als er niets te patchen valt?",f:"Zero-day = kwetsbaarheid zonder beschikbare patch op moment van ontdekking/exploitatie. Aanpak: (1) Monitor threat intelligence (CISA, CERT). (2) Compenserende maatregelen: WAF, netwerksegmentatie, disable kwetsbare functionaliteit. (3) Defense in depth: segmentatie beperkt schade. (4) Patch zodra beschikbaar — onmiddellijk."}

];
;


// ── CONFIG ──────────────────────────────────────────
const cfg = {
  count: sessionStorage.getItem('cfg-count') || '50',
  order: sessionStorage.getItem('cfg-order') || 'shuffle',
  types: sessionStorage.getItem('cfg-types') || 'all',
};

// ── INIT ────────────────────────────────────────────
const POOL = window.QUESTIONS_cybersecurity || [];
let questions = [...POOL];
if (cfg.types !== 'all') questions = questions.filter(q => q.type === cfg.types);
if (cfg.order === 'shuffle') questions = questions.sort(() => Math.random() - 0.5);
if (cfg.count !== 'all') questions = questions.slice(0, parseInt(cfg.count));

let idx = 0, correct = 0, wrong = 0, sel = new Set();

function updateStats() {
  const done = idx, total = questions.length, left = total - done;
  const pct = done > 0 ? Math.round(correct / done * 100) : null;
  document.getElementById('sv-score').textContent = correct;
  document.getElementById('sv-wrong').textContent = wrong;
  document.getElementById('sv-left').textContent = left;
  document.getElementById('sv-pct').textContent = pct !== null ? pct + '%' : '—';
  document.getElementById('prog').style.width = (done / total * 100) + '%';
  document.getElementById('prog-txt').textContent = `Vraag ${Math.min(idx+1,total)} / ${total}`;
}

function renderQ() {
  sel = new Set();
  const q = questions[idx];
  const letters = ['A','B','C','D','E','F'];

  let body = '';
  const imgHtml = q.img ? `<div class="q-img"><img src="${q.img}" alt="Bijlage bij vraag" style="max-width:100%;border-radius:6px;border:1px solid var(--border);margin-bottom:16px;display:block"></div>` : '';
  if (q.type === 'open') {
    body = imgHtml + `<textarea class="open-inp" id="oa" rows="2" placeholder="Typ je antwoord hier…" oninput="onOI()"></textarea>`;
  } else {
    body = `<div class="opts">${q.o.map((o,i) => `<div class="opt" id="o${i}" onclick="tog(${i})"><div class="opt-box" id="b${i}"></div><span class="opt-letter">${letters[i]}</span><span class="opt-text">${o}</span></div>`).join('')}</div>`;
  }

  const tb = q.type === 'multi' ? `<span class="q-tbadge tb-multi">◈ Meerdere antwoorden</span>`
           : q.type === 'open'  ? `<span class="q-tbadge tb-open">✏ Open vraag</span>` : '';

  document.getElementById('q-container').innerHTML = `
    <div class="q-card">
      <div class="q-meta">
        <span class="q-num">V${idx+1}</span>
        <span class="q-sub">${q.t}</span>
        ${tb}
      </div>
      <div class="q-text">${q.q}</div>
      ${body}
      <button class="hint-btn" id="hint-btn" onclick="toggleHint()">💡 Hint</button>
      <div class="hint-box" id="hint-box">${q.h}</div>
      <div class="feedback" id="fb"></div>
    </div>`;

  const bc = document.getElementById('btn-check');
  bc.disabled = true;
  bc.classList.remove('hidden');
  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('btn-skip').classList.remove('hidden');

  if (q.type === 'open') {
    document.getElementById('oa').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!bc.disabled) check(); }
    });
  }
}

function onOI() {
  document.getElementById('btn-check').disabled = !document.getElementById('oa').value.trim();
}

function toggleHint() {
  const hb = document.getElementById('hint-box');
  hb.classList.toggle('show');
  document.getElementById('hint-btn').textContent = hb.classList.contains('show') ? '💡 Hint verbergen' : '💡 Hint';
}

function tog(i) {
  const q = questions[idx];
  if (document.getElementById('o'+i)?.classList.contains('locked')) return;
  if (q.type === 'mc') {
    sel.forEach(s => { document.getElementById('o'+s)?.classList.remove('sel'); const b=document.getElementById('b'+s); if(b) b.innerHTML=''; });
    sel.clear();
  }
  if (sel.has(i)) {
    sel.delete(i);
    document.getElementById('o'+i).classList.remove('sel');
    document.getElementById('b'+i).innerHTML = '';
  } else {
    sel.add(i);
    document.getElementById('o'+i).classList.add('sel');
    document.getElementById('b'+i).innerHTML = '✓';
  }
  document.getElementById('btn-check').disabled = sel.size === 0;
}

function check() {
  const q = questions[idx];
  let ok = false;

  if (q.type === 'open') {
    const raw = document.getElementById('oa').value.trim().toLowerCase();
    const acc = (q.ans||[]).map(a=>a.toLowerCase());
    const matches = acc.filter(a => raw.includes(a));
    const need = q.minMatch || 1;
    ok = matches.length >= need;
    const ta = document.getElementById('oa');
    ta.classList.add(ok?'ok':'bad');
    ta.disabled = true;
  } else {
    const s=[...sel], cor=q.c;
    q.o.forEach((_,i)=>document.getElementById('o'+i)?.classList.add('locked'));
    q.o.forEach((_,i)=>{
      const el=document.getElementById('o'+i),bx=document.getElementById('b'+i);
      if(!el) return;
      el.classList.remove('sel');
      if(s.includes(i)&&cor.includes(i)){el.classList.add('ok');if(bx)bx.innerHTML='✓';}
      else if(s.includes(i)&&!cor.includes(i)){el.classList.add('bad');if(bx)bx.innerHTML='✗';}
      else if(!s.includes(i)&&cor.includes(i)){el.classList.add('missed');if(bx)bx.innerHTML='!';}
    });
    ok = cor.every(c=>s.includes(c))&&s.every(sv=>cor.includes(sv));
  }

  if(ok) correct++; else wrong++;
  updateStats();

  const fb=document.getElementById('fb');
  fb.className='feedback show '+(ok?'fb-ok':'fb-bad');
  let fbExtra = '';
  if (!ok && q.type === 'open') {
    const acc2 = (q.ans||[]).map(a=>a.toLowerCase());
    const matched = acc2.filter(a => document.getElementById('oa')?.value.trim().toLowerCase().includes(a));
    const need2 = q.minMatch || 1;
    fbExtra = `<br><small style="opacity:.7">Gevonden trefwoorden: ${matched.length}/${need2} vereist${matched.length>0?' ('+matched.join(', ')+'.)':''}</small>`;
  }
  fb.innerHTML=(ok?'✅ <strong>Correct!</strong> ':'❌ <strong>Fout.</strong> ')+q.f+fbExtra;

  document.getElementById('btn-check').classList.add('hidden');
  document.getElementById('btn-skip').classList.add('hidden');
  const bn=document.getElementById('btn-next');
  bn.classList.remove('hidden');
  bn.textContent = idx>=questions.length-1 ? 'Resultaten →' : 'Volgende →';
  window.scrollTo({top:0,behavior:'smooth'});
}

function skipQ() { wrong++; updateStats(); advance(); }
function nextQ() { advance(); }
function advance() {
  idx++;
  if(idx>=questions.length){showScore();return;}
  renderQ();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showScore() {
  const total=questions.length, pct=Math.round(correct/total*100);
  const msg = pct>=85?'🏆 Uitstekend! Je beheerst de leerstof.':pct>=70?'👍 Goed gedaan! Nog wat herhaling.':pct>=55?'📚 Voldoende — extra studie aangeraden.':'💡 Herhaal de cursus en probeer opnieuw.';
  document.getElementById('quiz-screen').style.display='none';
  const sc=document.getElementById('score-screen');
  sc.style.display='block';
  sc.innerHTML=`
    <div class="sc-badge">🔐 Cybersecurity Intro</div>
    <div class="sc-pct">${pct}%</div>
    <div class="sc-msg">${msg}</div>
    <div class="sc-grid">
      <div class="sc-item"><span class="sc-num" style="color:var(--correct)">${correct}</span><span class="sc-lbl">Correct</span></div>
      <div class="sc-item"><span class="sc-num" style="color:var(--wrong)">${wrong}</span><span class="sc-lbl">Fout / Over</span></div>
      <div class="sc-item"><span class="sc-num" style="color:var(--muted2)">${total}</span><span class="sc-lbl">Totaal</span></div>
    </div>
    <div class="sc-btns">
      <a class="btn-home" href="index.html">← Andere module</a>
      <button class="btn-retry" onclick="location.reload()">↺ Opnieuw</button>
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

// Start
updateStats();
renderQ();
</script>
