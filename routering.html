{type:"mc",q:"Wat is het verschil tussen inbound en outbound ACL toepassing op een interface?",o:["Er is geen verschil","Inbound: filtert verkeer dat de interface INKOMT; Outbound: filtert verkeer dat de interface VERLAAT","Outbound is efficiënter","Inbound werkt niet op routers"],c:[1],h:"Inbound ACL = verkeer dat de router binnenkomt. Outbound = verkeer dat de router verlaat. Locatie bepaalt efficiency."},
{type:"mc",q:"Wat is een 'standard numbered ACL' op Cisco?",o:["ACL nummer 100-199","ACL nummer 1-99 die filtert op ALLEEN source IP-adres","Een type extended ACL","Een type named ACL"],c:[1],h:"Standard ACL (1-99) = enkel source IP. Extended ACL (100-199) = source+dest IP, protocol, poort."},
{type:"mc",q:"Wat is een 'named ACL'?",o:["Een ACL met een naam","Een ACL die aangeduid wordt met een naam in plaats van een nummer — makkelijker te beheren en bevat ook sequence numbers voor rij-aanpassing","Een type standaard ACL","Een type extended ACL"],c:[1],h:"Named ACL = onderhoudsvriendelijk. Je kunt regels toevoegen/verwijderen op specifieke posities via sequence numbers."},
{type:"mc",q:"Wat is het RFC 1918-adresruimte?",o:["Publieke IP-adressen","Privé IP-adressen die niet routeerbaar zijn op het internet: 10.x.x.x, 172.16-31.x.x, 192.168.x.x","IPv6-adressen","Multicast-adressen"],c:[1],h:"RFC 1918 = privé-adressen. Achter NAT zijn miljoenen apparaten met 192.168.x.x adressen."},
{type:"mc",q:"Wat is IPv6 en welk probleem lost het op?",o:["Een nieuwe versie van OSPF","De opvolger van IPv4 met 128-bit adressen die het adresuitputtingsprobleem van IPv4 (32-bit) oplost","Een type routeringsprotocol","Een type VPN"],c:[1],h:"IPv6 = 128-bit = 340 undeciljoen adressen. IPv4 had 4.3 miljard adressen — uitgeput in 2011."},
{type:"mc",q:"Wat is een IPv6 link-local adres?",o:["Een publiek IPv6-adres","Een automatisch geconfigureerd IPv6-adres geldig enkel op het lokale netwerksegment (prefix fe80::/10) — nodig voor NDP","Een type multicast-adres","Een type anycast-adres"],c:[1],h:"Link-local = FE80::/10. Automatisch geconfigureerd op elke IPv6-interface. Niet routeerbaar."},
{type:"mc",q:"Wat is NDP (Neighbor Discovery Protocol) in IPv6?",o:["Een type routeringsprotocol","Het IPv6-equivalent van ARP — ontdekt buren, resolveert MAC-adressen en detecteert duplicate adressen","Een type DNS-protocol","Een type DHCP-protocol"],c:[1],h:"NDP = ARP voor IPv6. Gebruikt multicast i.p.v. broadcast. Ook voor router discovery en SLAAC."},
{type:"mc",q:"Wat is SLAAC (Stateless Address Autoconfiguration) in IPv6?",o:["Een type DHCP","Een mechanisme waarbij IPv6-apparaten zichzelf automatisch configureren op basis van router advertisements zonder DHCPv6-server","Een type NDP-functie","Een type routeringsprotocol"],c:[1],h:"SLAAC = zelfconfiguratie. Router advertiseert prefix → apparaat combineert met zijn EUI-64 MAC → volledig adres."},
{type:"mc",q:"Wat is het verschil tussen router advertisement en router solicitation in NDP?",o:["Ze zijn identiek","Router advertisement (RA): router stuurt prefix-info; Router solicitation (RS): host vraagt om een RA","RS is van router; RA van host","RA is ouder dan RS"],c:[1],h:"Host stuurt RS → router reageert met RA → host configureert zijn adres via SLAAC."},
{type:"mc",q:"Wat is het doel van 'show interfaces' op een Cisco switch/router?",o:["Toont de routeringstabel","Toont gedetailleerde informatie over alle interfaces: status, errors, bandbreedte, input/output statistieken","Toont de VLAN-tabel","Toont de ARP-tabel"],c:[1],h:"show interfaces = alles over een interface. Input errors, CRC errors, collisions — essentieel voor troubleshooting."},
{type:"mc",q:"Wat is een 'duplex mismatch' en wat veroorzaakt het?",o:["Een type IP-conflict","Een configuratieprobleem waarbij één kant full-duplex en de andere kant half-duplex gebruikt — veroorzaakt collisions en slechte prestaties","Een type VLAN-conflict","Een type STP-probleem"],c:[1],h:"Duplex mismatch = de meest voorkomende performance-oorzaak op schakellinks. Stel duplex altijd expliciet in."},
{type:"mc",q:"Wat is een 'speed mismatch' op een switch-poort?",o:["Twee switches met verschillende modellen","Wanneer beide kanten van een link verschillende snelheden proberen te gebruiken — de verbinding komt niet op of werkt slecht","Een type duplex-probleem","Een type VLAN-conflict"],c:[1],h:"Speed mismatch = geen verbinding of terugval naar lagere snelheid. Zet speed en duplex altijd handmatig."},
{type:"mc",q:"Wat is het doel van 'DHCP snooping trust'?",o:["Vertrouw alle DHCP-servers","Markeer enkel de switch-poort verbonden met de legitieme DHCP-server als 'trusted' — alle andere poorten zijn untrusted","Vertrouw alle DHCP-clients","Een type VLAN-trust"],c:[1],h:"Trusted port = mag DHCP-antwoorden sturen. Untrusted = mag enkel DHCP-verzoeken sturen. Rogue DHCP blocked."},
{type:"mc",q:"Wat is het doel van 'BPDU filter' op een PortFast-poort?",o:["Versnelt STP-convergentie","Blokkeert alle BPDUs","Voorkomt dat BPDUs verzonden EN ontvangen worden op een poort — gebruik alleen op strikt gecontroleerde poorten","Hetzelfde als BPDU Guard"],c:[2],h:"BPDU filter = volledig STP-stilte op een poort. Gevaarlijker dan BPDU Guard. BPDU Guard is veiliger voor toegangspoorten."},
{type:"mc",q:"Wat is 'UplinkFast' in Cisco STP?",o:["Een verouderde Cisco STP-feature die snelle failover biedt voor uplinks door een directe switch naar Forwarding — vervangen door RSTP","Versnelt uplinks algemeen","Een type trunk-feature","Een type VTP-feature"],c:[0],h:"UplinkFast = klassiek Cisco. Met RSTP bereik je hetzelfde sneller en standaard. Gebruik RSTP/MST i.p.v. UplinkFast."},
{type:"mc",q:"Wat is 'MST' (Multiple Spanning Tree)?",o:["Een type VLAN-protocol","Een STP-variant (IEEE 802.1s) die meerdere VLANs groepeert in MST-instanties — betere schaalbaarheid dan PVST+","Een type EtherChannel","Een type VTP-variant"],c:[1],h:"MST = VLAN-groepen per STP-instantie. Efficiënter dan PVST+ (één instantie per VLAN) voor grote netwerken."},
{type:"mc",q:"Wat is 'DTP' (Dynamic Trunking Protocol)?",o:["Een type routeringsprotocol","Een type STP","Een Cisco-protocol dat automatisch onderhandelt of een poort access of trunk wordt — best uitschakelen op access-poorten","Een type VTP"],c:[2],h:"DTP auto-trunking = beveiligingsrisico. Schakel DTP uit op access-poorten: 'switchport nonegotiate'."},
{type:"mc",q:"Wat is een 'rogue switch' aanval via DTP?",o:["Een type VLAN-aanval","Een type STP-aanval","Een aanvaller sluit een switch aan en laat DTP onderhandelen tot trunk-modus — geeft toegang tot alle VLANs","Een type ARP-aanval"],c:[2],h:"Rogue switch + DTP = trunk → alle VLANs zichtbaar. Bescherm via 'switchport mode access + nonegotiate'."},
{type:"mc",q:"Wat is 'CDP-based VLAN Discovery'?",o:["Een type VLAN-scan","Een type STP-feature","Het automatisch configureren van VoIP-telefoons met het juiste Voice VLAN op basis van CDP-berichten van de switch","Een type VTP-feature"],c:[2],h:"CDP + VoIP = switch adverteert het voice VLAN via CDP → IP-telefoon configureert zichzelf automatisch."},
{type:"mc",q:"Wat is een 'VACL' (VLAN Access Control List)?",o:["Een type standard ACL","Een type extended ACL","Een ACL die toegepast wordt op een VLAN voor het filteren van verkeer binnen het VLAN of tussen VLANs op een switch","Een type NAT-regel"],c:[2],h:"VACL = ACL op een VLAN. Filterverkeer dat nooit een router passeert — bijv. directe L2-communicatie binnen een VLAN."},
{type:"mc",q:"Wat is een 'trunk allowed VLAN' beveiligingspraktijk?",o:["Sta alle VLANs toe op alle trunks","Voeg alle VLANs toe aan elke trunk","Beperk trunks tot enkel de VLANs die echt nodig zijn voor een segment — verkleint de aanvalsoppervlakte","Verwijder native VLAN van trunks"],c:[2],h:"Minimaal noodzakelijke VLANs op elke trunk = kleinere blast radius bij een VLAN-aanval."},
{type:"mc",q:"Wat is een 'management plane' op een netwerkapparaat?",o:["De dataverwerking","Een type routing tabel","Het deel van het netwerkapparaat dat verantwoordelijk is voor het beheer (SSH, SNMP, syslog) — apart beveiligen van het data plane","Een type ARP-tabel"],c:[2],h:"Drie vlakken: Data plane (pakketdoorstuur), Control plane (routeringsprotocollen), Management plane (beheer)."},
{type:"mc",q:"Wat is een 'control plane' op een netwerkapparaat?",o:["Het datapad","Een type monitoring","Het deel dat routeringsprotocollen, STP, OSPF hello's en andere protocolberichten verwerkt — apart van data doorstuur","Een type beheer"],c:[2],h:"Control plane = routeringsprotocollen draaien. Aanval op control plane (bijv. OSPF flooding) = CPU overbelasting."},
{type:"mc",q:"Wat is 'CoPP' (Control Plane Policing)?",o:["Een type QoS","Een type firewall","Een type ACL","Een beveiligingsfunctie die het verkeer naar de router-CPU (control plane) beperkt om CPU-aanvallen te voorkomen"],c:[3],h:"CoPP = bescherm de router-CPU. Stel limieten in voor hoeveel control plane verkeer (OSPF, SNMP, SSH) de CPU bereikt."},
{type:"mc",q:"Wat is een 'MPLS VPN' (L3VPN)?",o:["Een type internet VPN","Een type IPsec VPN","Een type SSL VPN","Een service waarbij een MPLS-provider VPN-connectiviteit biedt tussen klantlocaties via een gedeelde MPLS-infrastructuur"],c:[3],h:"MPLS L3VPN = gedeelde infrastructure, geïsoleerde klantnetwerken via VRFs en MPLS-labels."},
{type:"mc",q:"Wat is een 'VRF' (Virtual Routing and Forwarding)?",o:["Een type virtuele switch","Een type VLAN","Een type routing protocol","Een virtuele routerinstantie die een aparte routeringstabel bijhoudt — meerdere VRFs op één router voor multi-tenant isolatie"],c:[3],h:"VRF = meerdere routeringstabellen op één router. Klant A en B kunnen overlappende IP's hebben zonder conflict."},
{type:"mc",q:"Wat is 'DMVPN' (Dynamic Multipoint VPN)?",o:["Een type statisch VPN","Een type MPLS VPN","Een type SSL VPN","Een Cisco hub-and-spoke VPN-architectuur die ook spoke-to-spoke tunnels dynamisch aanmaakt — efficiënter dan full-mesh IPsec"],c:[3],h:"DMVPN = hub-and-spoke VPN met on-demand spoke-to-spoke verbindingen. Ideaal voor WAN met veel lokaties."},
{type:"mc",q:"Wat is 'SD-WAN' (Software-Defined WAN)?",o:["Een type MPLS-service","Een type VPN","Een type routing protocol","Een WAN-architectuur waarbij een centrale controller de WAN-verbindingen beheert over meerdere transports (MPLS, internet, LTE)"],c:[3],h:"SD-WAN = flexible WAN. Goedkoop internet + MPLS intelligent combineren. Traffic steering op basis van applicatie."},
{type:"mc",q:"Wat is het doel van 'NetFlow' op een Cisco router?",o:["Een type firewall","Een type routeringsprotocol","Een type SNMP-feature","Het exporteren van verkeersstatistieken (wie praat met wie, hoeveel, welk protocol) voor analyse en capacity planning"],c:[3],h:"NetFlow = verkeersanalyse. Wie gebruikt hoeveel bandbreedte? Welke applicaties? Nuttig voor security en capacity planning."},
{type:"mc",q:"Wat is 'SFLOW' en hoe verschilt het van NetFlow?",o:["Ze zijn identiek","sFlow is sneller","NetFlow is open standaard","sFlow = open standaard, samples pakketdata op schaal; NetFlow = Cisco-proprietary, exporteert flow-statistieken"],c:[3],h:"sFlow = sampling op hoge snelheid. NetFlow = exacte flow-statistieken. sFlow schaalbaar op hoge-snelheidslinks."},
{type:"mc",q:"Wat is een 'proxy ARP'?",o:["Een type ARP-aanval","Een type ARP-beveiliging","Een type ARP-cache","Een router-feature waarbij de router ARP-verzoeken beantwoordt namens een host in een ander subnet"],c:[3],h:"Proxy ARP = de router antwoordt 'ik ben de gateway voor dat adres'. Nuttig voor sommige legacy-configuraties maar kan verwarrend zijn."},
{type:"mc",q:"Wat is HSRP (Hot Standby Router Protocol)?",o:["Een type STP","Een type routeringsprotocol","Een type VLAN","Een Cisco-protocol voor gateway-redundantie waarbij twee routers één virtueel IP-adres delen"],c:[3],h:"HSRP = actieve/standby gateways. Clients configureren het virtuele IP als gateway. Actieve router valt uit → standby neemt over."},
{type:"mc",q:"Wat is VRRP (Virtual Router Redundancy Protocol)?",o:["Een Cisco-proprietary redundantieprotocol","Een type STP","Een type routeringsprotocol","De open standaard equivalent van HSRP (IEEE) — meerdere routers delen één virtueel IP-adres voor gateway-redundantie"],c:[3],h:"VRRP = open HSRP. Hetzelfde principe maar vendor-onafhankelijk. Gebruik VRRP voor multi-vendor omgevingen."},
{type:"mc",q:"Wat is GLBP (Gateway Load Balancing Protocol)?",o:["Een type HSRP-variant","Een type VPN","Een type routeringsprotocol","Een Cisco-protocol voor gateway-redundantie MET load balancing — meerdere routers zijn actief en verwerken elk een deel van het verkeer"],c:[3],h:"GLBP = load balanced gateway redundantie. Vier routers kunnen elk 25% van het verkeer verwerken + failover."},
{type:"mc",q:"Wat is 'Gratuitous ARP' en hoe kan het misbruikt worden?",o:["Een type ARP-verzoek","Een type ARP-cache","Een type ARP-beveiliging","Een ARP-bericht dat een apparaat stuurt om zijn IP-MAC mapping te adverteren — misbruikt bij ARP poisoning om de cache te vervuilen"],c:[3],h:"Gratuitous ARP = 'ik heb dit IP-adres'. Onzevraagd. Aanvallers sturen valse gratuitous ARPs om caches te vergiftigen."},
{type:"mc",q:"Wat is 'RSTP edge port' en hoe configuur je het op Cisco?",o:["Hetzelfde als trunk port","Een type access-poort","Een type uplink-poort","Een RSTP-poort die onmiddellijk in forwarding gaat zonder STP-states — geconfigureerd via 'spanning-tree portfast'"],c:[3],h:"RSTP edge port = PortFast in RSTP-terminologie. Cisco: spanning-tree portfast. Enkel voor access-poorten!"},
{type:"mc",q:"Wat is 'RSTP proposal/agreement mechanisme'?",o:["Een type STP-bericht","Een type STP-timer","Een type BPDU-type","Het snelle RSTP-convergentiemechanisme waarbij een nieuwe link direct Forwarding gaat na een handshake met de buur"],c:[3],h:"Proposal/Agreement = RSTP's geheim voor snelle convergentie. Geen 30-50 seconde wachten — milliseconden."},
{type:"mc",q:"Wat is een 'CAM-table overflow' aanval?",o:["Hetzelfde als ARP poisoning","Een type VLAN-aanval","Een type STP-aanval","Een aanval waarbij een switch's CAM-table gevuld wordt met valse MAC-adressen zodat hij degradeert naar hub-gedrag (MAC flooding)"],c:[3],h:"CAM overflow = MAC flooding. De aanval en het resultaat zijn hetzelfde. Port security beperkt het aantal MAC-adressen per poort."},
{type:"mc",q:"Wat doet het commando 'switchport port-security maximum 2'?",o:["Staat 2 VLANs toe","Staat 2 clients toe","Configureert 2 trunk-VLANs","Beperkt het aantal MAC-adressen op de poort tot 2 — meer MAC's = security violation actie"],c:[3],h:"Port security maximum = CAM-table beperking per poort. Nuttig om MAC flooding te voorkomen."},
{type:"mc",q:"Wat zijn de drie port-security violation modes op Cisco?",o:["Allow, Block, Monitor","Accept, Deny, Log","Drop, Forward, Block","Protect (drop), Restrict (drop + log), Shutdown (poort uitschakelen)"],c:[3],h:"Protect = stil droppen. Restrict = droppen + SNMP/syslog. Shutdown = poort err-disabled. Shutdown is het strengst."},
{type:"mc",q:"Wat is een 'err-disabled' poort op een Cisco switch?",o:["Een uitgeschakelde poort","Een type trunk-poort","Een type access-poort","Een poort die automatisch uitgeschakeld is door de switch na een beveiligings- of configuratiefout — herstel via 'no shutdown' of auto-recovery"],c:[3],h:"Err-disabled = automatische uitschakeling. Oorzaken: port security violation, BPDU Guard, UDLD. Herstel manueel."},
{type:"mc",q:"Wat is 'UDLD' (Unidirectional Link Detection)?",o:["Een type STP-protocol","Een type routing-protocol","Een type EtherChannel-protocol","Een Cisco-protocol dat eenzijdige verbindingen detecteert — links die in één richting werken maar niet in de andere (fiber)"],c:[3],h:"UDLD = detecteer broken fiber links. Optisch = ene richting kan werken, andere niet. UDLD schakelt de link uit."},
{type:"mc",q:"Wat is 'LLDP-MED' (Media Endpoint Discovery)?",o:["Een type LLDP voor media-servers","Een type CDP-variant","Een type SNMP-extensie","Een uitbreiding van LLDP specifiek voor IP-telefoons — adverteert voice VLAN, QoS-beleid en locatie-informatie"],c:[3],h:"LLDP-MED = LLDP voor VoIP. Open standaard equivalent van Cisco CDP voor IP-telefoon configuratie."},
{type:"mc",q:"Wat is 'PoE' (Power over Ethernet) en wat zijn de standaarden?",o:["Een type netwerk-protocol","Een type VLAN-techniek","Een type QoS-methode","Voeding via Ethernet-kabel voor apparaten zoals IP-telefoons, AP's en camera's — IEEE 802.3af (15W), 802.3at (30W), 802.3bt (90W)"],c:[3],h:"PoE = geen apart stroomkabel nodig. 802.3af voor IP-phones, 802.3at voor AP's, 802.3bt voor hoge-vermogen apparaten."},
{type:"mc",q:"Wat is 'spanning-tree guard root' op een Cisco switch?",o:["Beschermt de root bridge","Hetzelfde als BPDU Guard","Hetzelfde als BPDU Filter","Voorkomt dat een niet-root switch de root bridge wordt door poorten te blokkeren die superieure BPDUs ontvangen"],c:[3],h:"Root Guard = root bridge positie verdedigen. Een poort met Root Guard gaat err-disabled als het superieure BPDUs ontvangt."},
{type:"mc",q:"Wat is een 'super VLAN' of 'VLAN aggregation'?",o:["Een VLAN met veel hosts","Een type trunk","Een type inter-VLAN routing","Een architectuur waarbij meerdere sub-VLANs één IP-subnet delen via een super VLAN interface — bespaard IP-adressen op access-switches"],c:[3],h:"Super VLAN = IP-adresruimte delen. Alle sub-VLANs gebruiken hetzelfde subnet maar zijn L2-geïsoleerd van elkaar."},
{type:"mc",q:"Wat is 'IP Source Guard with Static Bindings'?",o:["Een statische ARP-tabel","Een type statische route","Een type statische ACL","Handmatig gedefinieerde IP-MAC-poort bindingen voor apparaten zonder DHCP — uitbreiding van de DHCP-snooping binding database"],c:[3],h:"Statische bindings voor IP Source Guard = servers met vaste IP-adressen ook beschermen tegen spoofing."},
{type:"mc",q:"Wat is een 'passive mode' FTP en waarom is het relevant voor firewalls?",o:["Een type NAT-configuratie","FTP waarbij de server een datapoort opent die de client verbindt — werkt beter met firewalls dan active FTP (waarbij de server verbinding initieert)","Een type ACL","Een type file transfer"],c:[1],h:"Passive FTP = client initieert data-verbinding. Active FTP = server initieert → geblokkeerd door stateful firewalls."},
{type:"mc",q:"Wat is 'OSPF Authentication'?",o:["Een type OSPF-timer","Een type OSPF-feature","MD5 of SHA-gebaseerde authenticatie van OSPF-buren om valse OSPF-updates te voorkomen","Een type OSPF-beveiliging"],c:[2],h:"OSPF auth = verifieer dat hellos van echte OSPF-buren komen. Rogue router kan anders valse routes injecteren."},
{type:"mc",q:"Wat is 'EIGRP Authentication'?",o:["Een type EIGRP-metric","Een type EIGRP-timer","MD5 of SHA-gebaseerde authenticatie van EIGRP-updates om te voorkomen dat een aanvaller valse routes injecteert","Een type EIGRP-beveiliging"],c:[2],h:"Routeringsprotocol-authenticatie = voorkomen dat een aanvaller valse routes injecteert en verkeer omlegt."},
{type:"mc",q:"Wat is 'BGP session security' best practice?",o:["BGP enkel intern gebruiken","BGP met community strings beveiligen","BGP altijd zonder authenticatie","BGP MD5-authenticatie, TTL-beveiliging (GTSM), prefix-filtering en route-maps om BGP-hijacking te voorkomen"],c:[3],h:"BGP zonder beveiliging = aanvaller kan valse routes adverteren. MD5 + GTSM + prefix-filtering = veilige BGP-sessie."},
{type:"mc",q:"Wat is een 'MPLS label' en welke waarden zijn gereserveerd?",o:["Een 20-bit waarde (0-1.048.575) waarvan de laagste waarden gereserveerd zijn: 0=IPv4 explicit null, 3=implicit null (PHP)","Een 32-bit getal zonder restricties","Een 16-bit getal","Een 8-bit getal"],c:[0],h:"Label 0 = IPv4 explicit null (preserve QoS). Label 3 = implicit null (penultimate hop pop). Labels 0-15 zijn gereserveerd."},
{type:"mc",q:"Wat is 'Ethernet over MPLS' (EoMPLS)?",o:["Een type VLAN-techniek","Een L2VPN-dienst die Ethernet-frames tussen twee locaties tunnelt via een MPLS-kern — pseudo-wire","Een type IP-over-MPLS","Een type GRE-tunnel"],c:[1],h:"EoMPLS = stretch een Ethernet-segment over MPLS. Beide locaties zijn in hetzelfde L2 broadcast domain."},
{type:"mc",q:"Wat is 'IS-IS' routeringsprotocol?",o:["Een type OSPF-variant","Intermediate System to Intermediate System — een link-state IGP populair bij ISPs, ook IPv6-capable en schaalbaar","Een type BGP","Een type EIGRP"],c:[1],h:"IS-IS = OSPF's concurrente. Populair bij ISPs (Juniper-omgevingen). Werkt op eigen PDUs, niet op IP."},
{type:"mc",q:"Wat is een 'floating static route'?",o:["Een back-up statische route met hogere administrative distance die enkel actief wordt als de primaire route wegvalt","Een route die automatisch wordt berekend","Een type dynamische route","Een route zonder next-hop"],c:[0],h:"Floating static = hogere AD dan de primaire route. Blijft 'zweven' tot de primaire verdwijnt."},
{type:"mc",q:"Wat is administrative distance (AD)?",o:["Een waarde die de betrouwbaarheid van een routeringsbron aangeeft — lagere AD = hogere voorkeur","De afstand in meters van de router","De kost van een route","De bandbreedte van een link"],c:[0],h:"AD: Connected=0, Static=1, OSPF=110, RIP=120. Lagere waarde = meer vertrouwd."},
{type:"mc",q:"Wat is een 'metric' in routeringsprotocollen?",o:["De waarde die bepaalt welke route het beste is als er meerdere routes naar hetzelfde netwerk zijn","De AD van een route","De routeringstabelgrootte","De verwerkingskracht van de router"],c:[0],h:"Metric = hoe goed is deze route? OSPF gebruikt cost (bandbreedte), RIP gebruikt hop count."},
{type:"mc",q:"Wat is de metric die OSPF gebruikt?",o:["Cost — gebaseerd op bandbreedte van de link (hogere bandbreedte = lagere cost)","Hop count","Delay","MTU"],c:[0],h:"OSPF cost = 100Mbps / link_bandbreedte. Gigabit link (1Gbps) = cost 1. FastEthernet (100Mbps) = cost 1."},
{type:"mc",q:"Wat is de metric die RIP gebruikt?",o:["Hop count — maximaal 15 hops, hop 16 = onbereikbaar","Cost","Delay","Bandbreedte"],c:[0],h:"RIP = telroutes. Meer dan 15 routers tussen bron en doel = onbereikbaar. Limiteert netwerkomvang."},
{type:"mc",q:"Wat is een 'routing loop' en hoe voorkomen routeringsprotocollen dit?",o:["Pakketten die oneindig rondcirkelen — voorkomen via split horizon, route poisoning en hold-down timers","Een type STP-probleem","Een type broadcast storm","Een type VLAN-probleem"],c:[0],h:"Routing loop = circular: A→B→C→A→... Pakketten reizen nooit aan. TTL beperkt de schade."},
{type:"mc",q:"Wat is 'split horizon'?",o:["Een RIP-regel: stuur geen route-informatie terug via de interface waarlangs je die informatie ontvangen hebt","Een type STP-beveiliging","Een type VLAN-techniek","Een type NAT-configuratie"],c:[0],h:"Split horizon = stuur niet terug waar je het vandaan hebt. Voorkomt eenvoudige routing loops."},
{type:"mc",q:"Wat is EIGRP?",o:["Een Cisco-proprietary advanced distance-vector routeringsprotocol dat bandbreedte, delay, load en reliability als metric gebruikt","Een open standaard routeringsprotocol","Een type spanning tree protocol","Een type VLAN-protocol"],c:[0],h:"EIGRP = Cisco's eigen protocol. Combineert distance-vector en link-state eigenschappen. Zeer snel convergerend."},
{type:"mc",q:"Wat is BGP en waar wordt het gebruikt?",o:["Border Gateway Protocol — het routeringsprotocol van het internet dat verkeer route tussen autonome systemen","Een intern routeringsprotocol","Een type VLAN-protocol","Een type STP-variant"],c:[0],h:"BGP = het 'ruggengraat'-protocol van het internet. Elke ISP spreekt BGP met andere ISPs."},
{type:"mc",q:"Wat is een autonome systeem (AS) in routering?",o:["Een netwerk of groep netwerken onder één enkel administratief beheer met een gemeenschappelijk routeringsbeleid","Een zelfstandige router","Een type VLAN","Een type subnet"],c:[0],h:"AS = één administratieve eenheid. Bedrijven en ISPs hebben elk hun eigen AS-nummer."},
{type:"mc",q:"Wat is VLSM (Variable Length Subnet Masking)?",o:["Het gebruik van verschillende subnetmaskers voor subnetten van hetzelfde netwerk om IP-adressen efficiënt te verdelen","Een type VLAN-techniek","Een type NAT","Een type routeringsprotocol"],c:[0],h:"VLSM = flexibele subnetting. /30 voor point-to-point links, /24 voor kantoren — optimaal adresgebruik."},
{type:"mc",q:"Wat is subnetting?",o:["Het verdelen van een netwerk in kleinere subnetwerken door bits van het host-gedeelte te 'lenen' voor het netwerk-gedeelte","Het samenvoegen van netwerken","Een type VLAN","Een type NAT"],c:[0],h:"Subnetten = opdelen. Eén groot /16 netwerk opdelen in 256 /24 subnetten voor verschillende afdelingen."},
{type:"mc",q:"Wat is het doel van CIDR (Classless Inter-Domain Routing)?",o:["Flexibele IP-adressering zonder vaste klassen (A/B/C) — maakt efficiëntere adresverdeling en route aggregatie mogelijk","Een type routeringsprotocol","Een type NAT","Een type VLAN"],c:[0],h:"CIDR = voorbij de klassen. /22 in plaats van altijd /8, /16 of /24. Meer flexibiliteit, minder verspilling."},
{type:"mc",q:"Wat is route summarization (route aggregation)?",o:["Het samenvatten van meerdere specifieke routes in één minder specifieke route — verkleint routeringstabellen","Het uitbreiden van een route","Een type NAT","Een type VLAN"],c:[0],h:"10.0.0.0/24, 10.0.1.0/24, 10.0.2.0/24, 10.0.3.0/24 → samengevat als 10.0.0.0/22."},
{type:"mc",q:"Wat is een point-to-point link en welk subnetmasker gebruik je typisch?",o:["Een directe verbinding tussen twee routers — /30 of /31 omdat je slechts twee adressen nodig hebt","Een verbinding voor veel hosts, /24","Een type VLAN","Een type trunk"],c:[0],h:"/30 = 4 adressen: netwerk, 2 hosts, broadcast. /31 = 2 adressen voor point-to-point (RFC 3021)."},
{type:"mc",q:"Wat is een loopback interface op een router?",o:["Een virtuele interface zonder fysieke kabel die altijd actief is — nuttig als router-ID, management interface en voor testen","Een interface voor lokaal verkeer","Een type VLAN-interface","Een type trunk-interface"],c:[0],h:"Loopback = altijd Up/Up. Ideaal als stabiele router-ID voor OSPF/BGP en als management-adres."},
{type:"mc",q:"Wat is OSPF Area 0?",o:["De backbone area van OSPF — alle andere areas moeten direct of via virtual links verbonden zijn met area 0","Een optioneel OSPF-gebied","Een type OSPF-configuratie","Een type AS"],c:[0],h:"Area 0 = het centrum. Alle inter-area verkeer loopt via area 0. Vergelijkbaar met een hub-and-spoke."},
{type:"mc",q:"Wat is een OSPF designated router (DR)?",o:["Op een multi-access netwerk (bijv. Ethernet) de router die als centraal punt fungeert voor LSA-uitwisseling — vermindert OSPF-overhead","De router met de meeste routes","De root bridge van OSPF","De router met het laagste router-ID"],c:[0],h:"DR/BDR = efficiëntie op shared media. Niet elke router praat met elke andere — enkel met DR/BDR."},
{type:"mc",q:"Wat is een 'hello packet' in OSPF?",o:["Een OSPF-pakket dat periodiek verstuurd wordt om neighborships te onderhouden en dead intervals te detecteren","Een type ICMP-bericht","Een type ARP-bericht","Een type STP-bericht"],c:[0],h:"Hello = ik leef nog. OSPF neighbors verwachten regelmatig hello-pakketten. Geen hello = link dood."},
{type:"mc",q:"Wat is een OSPF neighbour relationship?",o:["Een bijdirectionale OSPF-communicatierelatie tussen twee routers die OSPF hello-pakketten uitwisselen via een gedeelde interface","Een type VLAN-relatie","Een type BGP-sessie","Een type STP-relatie"],c:[0],h:"Neighbor = OSPF-partner. Neighbors wisselen LSAs (topologie-informatie) uit."},
{type:"mc",q:"Wat is een LSA (Link State Advertisement) in OSPF?",o:["Een pakket dat topologie-informatie bevat die OSPF routers uitwisselen om hun netwerktopologie te synchroniseren","Een type ARP-aankondiging","Een type BGP-update","Een type SNMP-trap"],c:[0],h:"LSA = bouwsteen van de OSPF topologie-database. Elke router kent alle LSAs in zijn area."},
{type:"mc",q:"Wat is een routing table vs. een forwarding table?",o:["Routing table = logische weergave van bekende netwerken; forwarding table = geoptimaliseerde hardware-tabel voor snelle pakketdoorstuur","Ze zijn identiek","Forwarding table is groter","Routing table is in hardware"],c:[0],h:"Routing table = software (show ip route). Forwarding table = hardware (CEF/FIB) voor lijnsnelheid forwarding."},
{type:"mc",q:"Wat is Cisco Express Forwarding (CEF)?",o:["Een Cisco hardware-acceleratietechnologie die een FIB en adjacency table gebruikt voor lijnsnelheid pakketdoorstuur","Een type routeringsprotocol","Een type STP","Een type VLAN"],c:[0],h:"CEF = fast forwarding. De router hoeft niet elke route-opzoeking software-matig te doen."},
{type:"mc",q:"Wat is een 'null route' of 'black hole route'?",o:["Een route die pakketten weggooit — nuttig als veiligheidsnet om pakketten naar niet-bestaande bestemmingen te droppen","Een route zonder bestemming","Een type default route","Een type floating static route"],c:[0],h:"Null0 interface = black hole. ip route 10.0.0.0 255.0.0.0 Null0 = gooi alle pakketten naar dit netwerk weg."},
{type:"mc",q:"Wat is IP SLA in Cisco-configuratie?",o:["Een Cisco-feature die continu connectiviteit en performance meet (ping, HTTP, TCP) en acties kan triggeren op basis van resultaten","Een type beveiligingspolicy","Een type QoS-functie","Een type VLAN-functie"],c:[0],h:"IP SLA = actieve monitoring vanuit de router. Combineer met floating static routes voor automatische failover."},
{type:"mc",q:"Wat is QoS (Quality of Service)?",o:["Mechanismen die bepaald verkeer prioriteit geven over het netwerk — essentieel voor VoIP en video","Een type beveiliging","Een type routeringsprotocol","Een type VLAN"],c:[0],h:"QoS = verkeersprioriteit. VoIP-pakketten voor data-backup-pakketten. Latency en jitter minimaliseren."},
{type:"mc",q:"Wat is DSCP (Differentiated Services Code Point)?",o:["Een 6-bit markering in de IP-header die de QoS-klasse aangeeft voor prioriteitsbehandeling","Een type IP-adres","Een type VLAN-tag","Een type routeringsprotocol"],c:[0],h:"DSCP = QoS-markering in het IP-pakket. EF (46) = hoogste prioriteit voor VoIP. CS0 = standaard."},
{type:"mc",q:"Wat is een 'MPLS label' en welke waarden zijn gereserveerd?",o:["Een 20-bit waarde (0-1.048.575) waarvan de laagste waarden gereserveerd zijn: 0=IPv4 explicit null, 3=implicit null (PHP)","Een 32-bit getal zonder restricties","Een 16-bit getal","Een 8-bit getal"],c:[0],h:"Label 0 = IPv4 explicit null (preserve QoS). Label 3 = implicit null (penultimate hop pop). Labels 0-15 zijn gereserveerd."},
{type:"mc",q:"Wat is 'Ethernet over MPLS' (EoMPLS)?",o:["Een type IP-over-MPLS","Een L2VPN-dienst die Ethernet-frames tussen twee locaties tunnelt via een MPLS-kern — pseudo-wire","Een type GRE-tunnel","Een type VLAN-techniek"],c:[1],h:"EoMPLS = stretch een Ethernet-segment over MPLS. Beide locaties zijn in hetzelfde L2 broadcast domain."},
{type:"mc",q:"Wat is 'IS-IS' routeringsprotocol?",o:["Een type EIGRP","Een type BGP","Intermediate System to Intermediate System — een link-state IGP populair bij ISPs, ook IPv6-capable en schaalbaar","Een type OSPF-variant"],c:[2],h:"IS-IS = OSPF's concurrente. Populair bij ISPs (Juniper-omgevingen). Werkt op eigen PDUs, niet op IP."},
{type:"mc",q:"Wat is een 'floating static route'?",o:["Een route die automatisch wordt berekend","Een route zonder next-hop","Een back-up statische route met hogere administrative distance die enkel actief wordt als de primaire route wegvalt","Een type dynamische route"],c:[2],h:"Floating static = hogere AD dan de primaire route. Blijft 'zweven' tot de primaire verdwijnt."},
{type:"mc",q:"Wat is administrative distance (AD)?",o:["De afstand in meters van de router","Een waarde die de betrouwbaarheid van een routeringsbron aangeeft — lagere AD = hogere voorkeur","De kost van een route","De bandbreedte van een link"],c:[1],h:"AD: Connected=0, Static=1, OSPF=110, RIP=120. Lagere waarde = meer vertrouwd."},
{type:"mc",q:"Wat is een 'metric' in routeringsprotocollen?",o:["De routeringstabelgrootte","De verwerkingskracht van de router","De AD van een route","De waarde die bepaalt welke route het beste is als er meerdere routes naar hetzelfde netwerk zijn"],c:[3],h:"Metric = hoe goed is deze route? OSPF gebruikt cost (bandbreedte), RIP gebruikt hop count."},
{type:"mc",q:"Wat is de metric die OSPF gebruikt?",o:["Delay","MTU","Hop count","Cost — gebaseerd op bandbreedte van de link (hogere bandbreedte = lagere cost)"],c:[3],h:"OSPF cost = 100Mbps / link_bandbreedte. Gigabit link (1Gbps) = cost 1. FastEthernet (100Mbps) = cost 1."},
{type:"mc",q:"Wat is de metric die RIP gebruikt?",o:["Bandbreedte","Cost","Delay","Hop count — maximaal 15 hops, hop 16 = onbereikbaar"],c:[3],h:"RIP = telroutes. Meer dan 15 routers tussen bron en doel = onbereikbaar. Limiteert netwerkomvang."},
{type:"mc",q:"Wat is een 'routing loop' en hoe voorkomen routeringsprotocollen dit?",o:["Een type VLAN-probleem","Een type broadcast storm","Pakketten die oneindig rondcirkelen — voorkomen via split horizon, route poisoning en hold-down timers","Een type STP-probleem"],c:[2],h:"Routing loop = circular: A→B→C→A→... Pakketten reizen nooit aan. TTL beperkt de schade."},
{type:"mc",q:"Wat is 'split horizon'?",o:["Een type NAT-configuratie","Een RIP-regel: stuur geen route-informatie terug via de interface waarlangs je die informatie ontvangen hebt","Een type VLAN-techniek","Een type STP-beveiliging"],c:[1],h:"Split horizon = stuur niet terug waar je het vandaan hebt. Voorkomt eenvoudige routing loops."},
{type:"mc",q:"Wat is EIGRP?",o:["Een type VLAN-protocol","Een type spanning tree protocol","Een open standaard routeringsprotocol","Een Cisco-proprietary advanced distance-vector routeringsprotocol dat bandbreedte, delay, load en reliability als metric gebruikt"],c:[3],h:"EIGRP = Cisco's eigen protocol. Combineert distance-vector en link-state eigenschappen. Zeer snel convergerend."},

{type:"mc",q:"Wat is het belangrijkste verschil tussen een IPv4 en IPv6 statische route?",o:["IPv6 statische routes vereisen geen next-hop IP-adres","IPv6 statische routes kunnen alleen via een exit-interface worden gedefinieerd","IPv6 statische routes gebruiken een volledig kwalitatief adres (link-local) als next-hop in plaats van een unicast adres","Er is geen verschil, de syntax is identiek"],c:[2],h:"Bij IPv6 is het vaak noodzakelijk om de link-local address van de next-hop router te specificeren, vooral op multi-access netwerken."},
{type:"mc",q:"Welk commando configureert een standaard IPv6 route?",o:["ipv6 route ::/0 [next-hop-ip]","ip route ::/0 [next-hop-ip]","ipv6 route 0.0.0.0/0 [next-hop-ip]","ipv6 route default [next-hop-ip]"],c:[0],h:"::/0 is het IPv6 equivalent van 0.0.0.0/0 in IPv4."},
{type:"mc",q:"Wanneer moet je bij een IPv6 statische route een 'link-local' adres als next-hop gebruiken?",o:["Altijd, omdat dit veiliger is","Nooit, gebruik altijd globale unicast adressen","Wanneer de next-hop router op een multi-access netwerk (zoals Ethernet) zit en je geen globale unicast next-hop wilt specificeren","Alleen bij point-to-point links"],c:[2],h:"Op multi-access netwerken is het aanbevolen om de link-local address van de next-hop te gebruiken om ambiguïteit te voorkomen."},
{type:"mc",q:"Wat betekent 'Dual Stack' in netwerken?",o:["Het gebruik van twee verschillende routeringsprotocollen tegelijkertijd","Een netwerkarchitectuur waarbij apparaten zowel IPv4 als IPv6 ondersteunen en verwerken","Het verdubbelen van de bandbreedte voor IPv6 verkeer","Het gebruik van twee fysieke netwerken voor redundancy"],c:[1],h:"Dual Stack betekent dat de infrastructuur en apparaten parallel IPv4 en IPv6 ondersteunen."},
{type:"mc",q:"Welke voorwaarde is nodig om IPv6 statische routes te configureren op een Cisco router?",o:["De router moet IPv6 unicast routing hebben ingeschakeld met 'ipv6 unicast routing'","De router moet een IPv4 license hebben","IPv6 moet uitgeschakeld zijn voor statische routes","Er is geen speciale configuratie nodig"],c:[0],h:"Zonder 'ipv6 unicast routing' zal de router IPv6 pakketten niet routeren, zelfs niet met statische routes."},
{type:"mc",q:"Wat is de 'administrative distance' van een statische IPv6 route?",o:["0","1","110","120"],c:[1],h:"Statische routes hebben standaard een AD van 1, net als bij IPv4."},
{type:"mc",q:"Hoe configureer je een 'floating static route' voor IPv6?",o:["Door een lagere AD te specificeren dan de primaire route","Door een hogere AD te specificeren dan de primaire route","Door de interface uit te schakelen","Door geen next-hop op te geven"],c:[1],h:"Een hogere AD zorgt ervoor dat de route alleen actief wordt als de primaire route (lagere AD) wegvalt."},
{type:"mc",q:"Wat is het doel van een 'recursive lookup' bij een statische route?",o:["De router zoekt de next-hop in de ARP-tabel","De router zoekt de next-hop in de routeringstabel om de uitgangsinterface te vinden","De router zoekt de next-hop in de DNS-tabel","De router zoekt de next-hop in de CAM-tabel"],c:[1],h:"Recursive lookup: De router kijkt eerst waar de next-hop IP zit, en vervolgens welke interface die next-hop bereikt."},
{type:"mc",q:"Welk adres type wordt gebruikt voor een IPv6 default route?",o:["::/0","::/128","2001::/32","FE80::/10"],c:[0],h:"::/0 vertegenwoordigt alle IPv6 adressen, vergelijkbaar met 0.0.0.0/0."},
{type:"mc",q:"Wat gebeurt er als een router een IPv6 pakket ontvangt dat niet in de routeringstabel staat?",o:["Het pakket wordt geforward naar de default route als die bestaat","Het pakket wordt direct weggegooid (dropped)","Het pakket wordt teruggezonden naar de afzender","De router stuurt een ICMPv6 'Destination Unreachable' bericht"],c:[1],h:"Zonder een matching route of default route wordt het pakket verworpen."},
{type:"mc",q:"Welke interface is typisch het beste om een IPv6 statische route te definiëren op een point-to-point link?",o:["De exit-interface (bijv. Serial0/0/0)","Het link-local adres van de next-hop","Het globale unicast adres van de next-hop","Geen van deze opties"],c:[0],h:"Op point-to-point links is het voldoende om alleen de exit-interface op te geven, omdat er maar één bestemming mogelijk is."},
{type:"mc",q:"Wat is het verschil tussen 'ipv6 route' en 'ip route'?",o:["Ze zijn identiek","'ipv6 route' is voor IPv6, 'ip route' is voor IPv4","'ipv6 route' werkt alleen op switches","'ip route' werkt alleen op IPv6 netwerken"],c:[1],h:"De commando's zijn specifiek voor het IP-versie protocol."},
{type:"mc",q:"Kan een router zowel IPv4 als IPv6 statische routes hebben voor hetzelfde bestemmingsnetwerk?",o:["Nee, dit veroorzaakt conflicten","Ja, maar ze worden niet gelijktijdig gebruikt","Ja, ze co-existeren in de routeringstabel en worden onafhankelijk gebruikt","Alleen als Dual Stack is uitgeschakeld"],c:[2],h:"In een Dual Stack omgeving worden IPv4 en IPv6 routes onafhankelijk van elkaar verwerkt."},
{type:"mc",q:"Wat is de syntax voor een IPv6 statische route met een AD van 5?",o:["ipv6 route [netwerk] [masker] [next-hop] 5","ipv6 route [netwerk] [masker] [next-hop] metric 5","ipv6 route [netwerk] [masker] [next-hop] admin-distance 5","ipv6 route [netwerk] [masker] [next-hop] 5"],c:[0],h:"Het getal aan het einde van het commando specificeert de Administrative Distance."},
{type:"mc",q:"Welk type IPv6 adres is FE80::/10?",o:["Global Unicast","Unique Local","Link-Local","Multicast"],c:[2],h:"FE80::/10 is het bereik voor Link-Local adressen, alleen geldig op het lokale segment."},
{type:"mc",q:"Wat is de functie van 'ipv6 nd ra' in de context van statische routes?",o:["Het activeert IPv6 statische routes","Het is gerelateerd aan Router Advertisements, niet direct aan statische routes","Het configureert een statische route","Het schakelt IPv6 uit"],c:[1],h:"'ipv6 nd ra' is gerelateerd aan NDP (Neighbor Discovery Protocol) en Router Advertisements, niet aan het configureren van statische routes."},

// ── CONFIG ──────────────────────────────────────────
const cfg = {
  count: sessionStorage.getItem('cfg-count') || '50',
  order: sessionStorage.getItem('cfg-order') || 'shuffle',
  types: sessionStorage.getItem('cfg-types') || 'all',
};

// ── INIT ────────────────────────────────────────────
const POOL = window.QUESTIONS_routering || [];
let questions = [...POOL];
if (cfg.types !== 'all') questions = questions.filter(q => q.type === cfg.types);
if (cfg.order === 'shuffle') questions = questions.sort(() => Math.random() - 0.5);
if (cfg.count !== 'all') questions = questions.slice(0, parseInt(cfg.count));

let idx = 0, correct = 0, wrong = 0, sel = new Set();

function updateStats() {
  const done = idx, total = questions.length, left = total - done;
  const pct = done > 0 ? Math.round(correct / done * 100) : null;
  document.getElementById('sv-score').textContent = correct;
  document.getElementById('sv-wrong').textContent = wrong;
  document.getElementById('sv-left').textContent = left;
  document.getElementById('sv-pct').textContent = pct !== null ? pct + '%' : '—';
  document.getElementById('prog').style.width = (done / total * 100) + '%';
  document.getElementById('prog-txt').textContent = `Vraag ${Math.min(idx+1,total)} / ${total}`;
}

function renderQ() {
  sel = new Set();
  const q = questions[idx];
  const letters = ['A','B','C','D','E','F'];

  let body = '';
  if (q.type === 'open') {
    body = `<textarea class="open-inp" id="oa" rows="2" placeholder="Typ je antwoord hier…" oninput="onOI()"></textarea>`;
  } else {
    body = `<div class="opts">${q.o.map((o,i) => `<div class="opt" id="o${i}" onclick="tog(${i})"><div class="opt-box" id="b${i}"></div><span class="opt-letter">${letters[i]}</span><span class="opt-text">${o}</span></div>`).join('')}</div>`;
  }

  const tb = q.type === 'multi' ? `<span class="q-tbadge tb-multi">◈ Meerdere antwoorden</span>`
           : q.type === 'open'  ? `<span class="q-tbadge tb-open">✏ Open vraag</span>` : '';

  document.getElementById('q-container').innerHTML = `
    <div class="q-card">
      <div class="q-meta">
        <span class="q-num">V${idx+1}</span>
        <span class="q-sub">${q.t}</span>
        ${tb}
      </div>
      <div class="q-text">${q.q}</div>
      ${body}
      <button class="hint-btn" id="hint-btn" onclick="toggleHint()">💡 Hint</button>
      <div class="hint-box" id="hint-box">${q.h}</div>
      <div class="feedback" id="fb"></div>
    </div>`;

  const bc = document.getElementById('btn-check');
  bc.disabled = true;
  bc.classList.remove('hidden');
  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('btn-skip').classList.remove('hidden');

  if (q.type === 'open') {
    document.getElementById('oa').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!bc.disabled) check(); }
    });
  }
}

function onOI() {
  document.getElementById('btn-check').disabled = !document.getElementById('oa').value.trim();
}

function toggleHint() {
  const hb = document.getElementById('hint-box');
  hb.classList.toggle('show');
  document.getElementById('hint-btn').textContent = hb.classList.contains('show') ? '💡 Hint verbergen' : '💡 Hint';
}

function tog(i) {
  const q = questions[idx];
  if (document.getElementById('o'+i)?.classList.contains('locked')) return;
  if (q.type === 'mc') {
    sel.forEach(s => { document.getElementById('o'+s)?.classList.remove('sel'); const b=document.getElementById('b'+s); if(b) b.innerHTML=''; });
    sel.clear();
  }
  if (sel.has(i)) {
    sel.delete(i);
    document.getElementById('o'+i).classList.remove('sel');
    document.getElementById('b'+i).innerHTML = '';
  } else {
    sel.add(i);
    document.getElementById('o'+i).classList.add('sel');
    document.getElementById('b'+i).innerHTML = '✓';
  }
  document.getElementById('btn-check').disabled = sel.size === 0;
}

function check() {
  const q = questions[idx];
  let ok = false;

  if (q.type === 'open') {
    const raw = document.getElementById('oa').value.trim().toLowerCase();
    const acc = (q.ans||[]).map(a=>a.toLowerCase());
    ok = acc.some(a => raw===a || raw.includes(a) || a.includes(raw));
    const ta = document.getElementById('oa');
    ta.classList.add(ok?'ok':'bad');
    ta.disabled = true;
  } else {
    const s=[...sel], cor=q.c;
    q.o.forEach((_,i)=>document.getElementById('o'+i)?.classList.add('locked'));
    q.o.forEach((_,i)=>{
      const el=document.getElementById('o'+i),bx=document.getElementById('b'+i);
      if(!el) return;
      el.classList.remove('sel');
      if(s.includes(i)&&cor.includes(i)){el.classList.add('ok');if(bx)bx.innerHTML='✓';}
      else if(s.includes(i)&&!cor.includes(i)){el.classList.add('bad');if(bx)bx.innerHTML='✗';}
      else if(!s.includes(i)&&cor.includes(i)){el.classList.add('missed');if(bx)bx.innerHTML='!';}
    });
    ok = cor.every(c=>s.includes(c))&&s.every(sv=>cor.includes(sv));
  }

  if(ok) correct++; else wrong++;
  updateStats();

  const fb=document.getElementById('fb');
  fb.className='feedback show '+(ok?'fb-ok':'fb-bad');
  fb.innerHTML=(ok?'✅ <strong>Correct!</strong> ':'❌ <strong>Fout.</strong> ')+q.f;

  document.getElementById('btn-check').classList.add('hidden');
  document.getElementById('btn-skip').classList.add('hidden');
  const bn=document.getElementById('btn-next');
  bn.classList.remove('hidden');
  bn.textContent = idx>=questions.length-1 ? 'Resultaten →' : 'Volgende →';
  window.scrollTo({top:0,behavior:'smooth'});
}

function skipQ() { wrong++; updateStats(); advance(); }
function nextQ() { advance(); }
function advance() {
  idx++;
  if(idx>=questions.length){showScore();return;}
  renderQ();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showScore() {
  const total=questions.length, pct=Math.round(correct/total*100);
  const msg = pct>=85?'🏆 Uitstekend! Je beheerst de leerstof.':pct>=70?'👍 Goed gedaan! Nog wat herhaling.':pct>=55?'📚 Voldoende — extra studie aangeraden.':'💡 Herhaal de cursus en probeer opnieuw.';
  document.getElementById('quiz-screen').style.display='none';
  const sc=document.getElementById('score-screen');
  sc.style.display='block';
  sc.innerHTML=`
    <div class="sc-badge">🌐 Routering & Switching</div>
    <div class="sc-pct">${pct}%</div>
    <div class="sc-msg">${msg}</div>
    <div class="sc-grid">
      <div class="sc-item"><span class="sc-num" style="color:var(--correct)">${correct}</span><span class="sc-lbl">Correct</span></div>
      <div class="sc-item"><span class="sc-num" style="color:var(--wrong)">${wrong}</span><span class="sc-lbl">Fout / Over</span></div>
      <div class="sc-item"><span class="sc-num" style="color:var(--muted2)">${total}</span><span class="sc-lbl">Totaal</span></div>
    </div>
    <div class="sc-btns">
      <a class="btn-home" href="index.html">← Andere module</a>
      <button class="btn-retry" onclick="location.reload()">↺ Opnieuw</button>
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

// Start
updateStats();
renderQ();
</script>
</body>
</html>
