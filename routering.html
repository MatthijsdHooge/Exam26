<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌐 Routering & Switching — Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080b;--panel:#0d0f14;--panel2:#141720;
  --border:#1a1f2e;--border2:#242b3d;
  --text:#dde3f0;--muted:#4a5568;--muted2:#6b7280;
  --c:#ffb800;--correct:#22c55e;--wrong:#ef4444;--amber:#ffb800;--purple:#a855f7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(0,212,255,.05),transparent);pointer-events:none;z-index:0}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 80px;position:relative;z-index:1}

/* topbar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.back{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);background:transparent;border:1px solid var(--border2);padding:7px 14px;border-radius:4px;cursor:pointer;text-decoration:none;transition:all .15s;display:inline-block}
.back:hover{border-color:var(--muted);color:var(--text)}
.topic-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--c);border:1px solid;border-color:color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent);padding:5px 14px;border-radius:3px;margin-left:auto}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:7px;overflow:hidden;background:var(--panel);margin-bottom:16px}
.stat{text-align:center;padding:12px 0;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.sv{font-family:'IBM Plex Mono',monospace;font-size:1.3rem;font-weight:700;line-height:1;display:block}
.sl{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-top:3px;display:block}
.prog-wrap{height:3px;background:var(--border);border-radius:2px;margin-bottom:5px;overflow:hidden}
.prog{height:100%;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 70%,#fff));transition:width .5s ease;width:0;border-radius:2px}
.prog-txt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);text-align:right;margin-bottom:20px}

/* card */
.q-card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:32px 36px;margin-bottom:18px;animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.q-num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);border:1px solid color-mix(in srgb,var(--c) 25%,transparent);padding:3px 10px;border-radius:2px}
.q-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted2);background:var(--panel2);border:1px solid var(--border);padding:3px 10px;border-radius:2px}
.q-tbadge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 10px;border-radius:2px}
.tb-multi{color:var(--amber);background:rgba(255,184,0,.07);border:1px solid rgba(255,184,0,.2)}
.tb-open{color:var(--purple);background:rgba(168,85,247,.07);border:1px solid rgba(168,85,247,.2)}
.q-text{font-size:1.02rem;font-weight:500;line-height:1.65;margin-bottom:22px}

/* options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:13px;padding:12px 16px;border:1px solid var(--border);border-radius:5px;cursor:pointer;transition:border-color .12s,background .12s;background:var(--bg);user-select:none}
.opt:hover:not(.locked){border-color:var(--c);background:color-mix(in srgb,var(--c) 4%,transparent)}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,transparent)}
.opt.ok{border-color:var(--correct);background:rgba(34,197,94,.07)}
.opt.bad{border-color:var(--wrong);background:rgba(239,68,68,.07)}
.opt.missed{border-color:var(--amber);background:rgba(255,184,0,.06)}
.opt-box{width:18px;height:18px;flex-shrink:0;margin-top:2px;border:2px solid var(--border2);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .12s}
.opt.sel .opt-box{border-color:var(--c);background:var(--c);color:var(--bg)}
.opt.ok .opt-box{border-color:var(--correct);background:var(--correct);color:#fff}
.opt.bad .opt-box{border-color:var(--wrong);background:var(--wrong);color:#fff}
.opt.missed .opt-box{border-color:var(--amber);background:var(--amber);color:#000}
.opt-letter{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-top:3px;flex-shrink:0}
.opt-text{font-size:.92rem;line-height:1.5}

/* open */
.open-inp{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:5px;color:var(--text);padding:12px 16px;font-family:'IBM Plex Sans',sans-serif;font-size:.95rem;resize:none;transition:border-color .15s;margin-top:4px}
.open-inp:focus{outline:none;border-color:var(--c)}
.open-inp.ok{border-color:var(--correct);background:rgba(34,197,94,.07)}
.open-inp.bad{border-color:var(--wrong);background:rgba(239,68,68,.07)}

/* hint */
.hint-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--amber);background:rgba(255,184,0,.07);border:1px solid rgba(255,184,0,.2);padding:6px 14px;border-radius:4px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;margin-top:16px}
.hint-btn:hover{background:rgba(255,184,0,.13)}
.hint-box{margin-top:10px;padding:12px 16px;background:rgba(255,184,0,.06);border:1px solid rgba(255,184,0,.2);border-radius:5px;font-size:.88rem;line-height:1.6;color:var(--amber);display:none;animation:up .2s ease}
.hint-box.show{display:block}

/* feedback */
.feedback{margin-top:18px;padding:13px 18px;border-radius:5px;font-size:.88rem;line-height:1.6;display:none;animation:up .2s ease}
.feedback.show{display:block}
.fb-ok{background:rgba(34,197,94,.09);border:1px solid rgba(34,197,94,.3)}
.fb-bad{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.3)}

/* btns */
.btn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.btn{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:10px 22px;border-radius:4px;cursor:pointer;border:none;transition:all .15s}
.btn-check{background:var(--c);color:#07080b;font-weight:700}
.btn-check:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-1px)}
.btn-check:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;transform:none}
.btn-next{background:transparent;color:var(--c);border:1px solid var(--c)}
.btn-next:hover{background:color-mix(in srgb,var(--c) 8%,transparent)}
.btn-skip{background:transparent;color:var(--muted2);border:1px solid var(--border2)}
.btn-skip:hover{border-color:var(--muted);color:var(--text)}
.hidden{display:none!important}

/* score */
#score-screen{display:none;text-align:center;padding:60px 24px 100px;max-width:680px;margin:0 auto;position:relative;z-index:1}
.sc-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);padding:5px 16px;border-radius:2px;display:inline-block;margin-bottom:20px}
.sc-pct{font-family:'IBM Plex Mono',monospace;font-size:clamp(4rem,12vw,7rem);font-weight:700;line-height:1;margin:16px 0;color:var(--c)}
.sc-msg{font-size:1.05rem;color:var(--muted2);margin:12px 0 32px}
.sc-grid{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;margin:24px 0 40px}
.sc-item{text-align:center}
.sc-num{font-family:'IBM Plex Mono',monospace;font-size:2rem;font-weight:700;display:block}
.sc-lbl{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-top:3px;display:block}
.sc-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-home{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:13px 32px;border-radius:4px;cursor:pointer;font-weight:700;transition:all .15s;background:transparent;color:var(--c);border:1px solid var(--c);text-decoration:none;display:inline-block}
.btn-home:hover{background:color-mix(in srgb,var(--c) 8%,transparent)}
.btn-retry{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:13px 32px;border-radius:4px;cursor:pointer;font-weight:700;transition:all .15s;border:none;background:var(--c);color:#07080b}
.btn-retry:hover{filter:brightness(1.15);transform:translateY(-1px)}

@media(max-width:600px){
  .q-card{padding:20px 18px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:none}
  .stat:nth-child(3){border-right:1px solid var(--border)}
}
</style>
</head>
<body>

<div id="quiz-screen" class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← Terug</a>
    <span class="topic-pill">🌐 Routering & Switching</span>
  </div>

  <div class="stats">
    <div class="stat"><span class="sv" id="sv-score" style="color:var(--correct)">0</span><span class="sl">Correct</span></div>
    <div class="stat"><span class="sv" id="sv-wrong" style="color:var(--wrong)">0</span><span class="sl">Fout</span></div>
    <div class="stat"><span class="sv" id="sv-left" style="color:var(--c)">—</span><span class="sl">Resterend</span></div>
    <div class="stat"><span class="sv" id="sv-pct" style="color:#a855f7">—</span><span class="sl">Score %</span></div>
  </div>
  <div class="prog-wrap"><div class="prog" id="prog"></div></div>
  <div class="prog-txt" id="prog-txt">Vraag 1 / —</div>

  <div id="q-container"></div>

  <div class="btn-row">
    <button class="btn btn-skip" id="btn-skip" onclick="skipQ()">Sla over</button>
    <button class="btn btn-check" id="btn-check" disabled onclick="check()">Controleer</button>
    <button class="btn btn-next hidden" id="btn-next" onclick="nextQ()">Volgende →</button>
  </div>
</div>

<div id="score-screen"></div>


<script>
window.QUESTIONS_routering = [
{type:"mc",q:"Op welke OSI-laag werkt een switch?",o:["Laag 2 (Data Link)","Laag 1 (Physical)","Laag 3 (Network)","Laag 4 (Transport)"],c:[0],h:"Switches werken op MAC-adressen — dat is de Data Link laag."},
{type:"mc",q:"Wat is een CAM-table (Content Addressable Memory)?",o:["Een routeringstabel","Een ARP-tabel","Een tabel met IP-adressen en poortnummers","Een tabel die MAC-adressen koppelt aan switch-poorten"],c:[3],h:"De CAM-table = het 'geheugen' van de switch: welk MAC-adres zit achter welke poort?"},
{type:"mc",q:"Hoe leert een switch welk MAC-adres achter welke poort zit?",o:["Via SNMP","Via dynamic MAC address learning: de switch leest het bron-MAC-adres van elk inkomend frame","Via een manuele configuratie","Via ARP broadcasts"],c:[1],h:"De switch 'leert' door passief naar het source MAC van elk inkomend frame te kijken."},
{type:"mc",q:"Wat doet een switch als het destination MAC-adres NIET in de CAM-table staat?",o:["Het frame wordt teruggestuurd naar de afzender","De switch vraagt een ARP-request","Het frame wordt weggegooid","Het frame wordt geflooded naar alle poorten behalve de inkomende poort (unicast flooding)"],c:[3],h:"Unknown MAC = flood. De switch stuurt het frame naar alle poorten om de bestemming te vinden."},
{type:"mc",q:"Wat is het verschil tussen een switch en een hub?",o:["Een hub is sneller dan een switch","Een hub stuurt frames naar ALLE poorten; een switch stuurt frames alleen naar de juiste poort op basis van MAC-adres","Ze zijn identiek","Een switch werkt op laag 3; een hub op laag 2"],c:[1],h:"Switch = intelligent (MAC-gebaseerd). Hub = dom (broadcast naar iedereen)."},
{type:"mc",q:"Wat is een collision domain?",o:["Een VLAN-domein","Een routeringsdomein","Een netwerksegment waar slechts één apparaat tegelijk data kan sturen (botsingen mogelijk)","Een netwerksegment waar broadcasts worden uitgewisseld"],c:[2],h:"Hubs creëren één collision domain. Elke switch-poort is een apart collision domain."},
{type:"mc",q:"Wat is een broadcast domain?",o:["Een subnet","Een type VLAN","Een logisch netwerksegment waarbij alle apparaten elkaars broadcasts ontvangen","Een netwerksegment waar MAC-adressen worden gedeeld"],c:[2],h:"Broadcasts gaan naar het hele broadcast domain. Routers en VLANs begrenzen broadcast domains."},
{type:"multi",q:"Welke bewerkingen voert een switch uit bij het ontvangen van een frame? (meerdere antwoorden)",o:["Frame doorsturen of flooden","Forwarding beslissing nemen","Destination MAC opzoeken in CAM-table","Source MAC leren en in CAM-table opslaan","Ingress: frame binnenkomt op poort"],c:[4,3,2,1,0],h:"Het volledige switching-proces bestaat uit deze vijf stappen."},
{type:"mc",q:"Wat is store-and-forward switching?",o:["De switch buffert frames oneindig","De switch ontvangt het volledige frame, controleert op fouten (FCS), en stuurt het dan door","De switch stuurt het frame door na de eerste paar bytes","De switch stuurt frames terug bij fouten"],c:[1],h:"Store-and-forward = ontvang volledig → controleer → doorstuur. Betrouwbaarder maar iets trager."},
{type:"mc",q:"Wat is cut-through switching?",o:["De switch verwerpt kleine frames","De switch begint met doorsturen na het lezen van het destination MAC-adres — sneller maar geen foutcontrole","De switch wacht op het volledige frame","De switch gebruikt buffers voor alle frames"],c:[1],h:"Cut-through = begin meteen. Sneller, maar defecte frames worden toch doorgestuurd."},
{type:"mc",q:"Wat is een half-duplex verbinding?",o:["Verzenden of ontvangen, maar niet tegelijk — vergelijkbaar met een walkietalkie","Gelijktijdig verzenden en ontvangen mogelijk","Een verbinding met dubbele bandbreedte","Een verbinding zonder foutcorrectie"],c:[0],h:"Half-duplex = beurtelings communiceren. Full-duplex = tegelijk in beide richtingen."},
{type:"mc",q:"Wat is een trunk-poort op een switch?",o:["Een poort voor servers","Een poort die verkeer van meerdere VLANs draagt via 802.1Q tagging","Een uplink naar het internet","Een poort die één specifiek VLAN draagt"],c:[1],h:"Trunk = meerdere VLANs over één fysieke link. De VLAN-tag identificeert welk VLAN elk frame bij hoort."},
{type:"mc",q:"Wat is een VLAN?",o:["Een fysiek gescheiden netwerk","Een logisch gescheiden netwerk op één of meerdere switches — apparaten in hetzelfde VLAN communiceren alsof ze op hetzelfde fysieke netwerk zitten","Een type routeringsprotocol","Een beveiligingsgroep"],c:[1],h:"VLAN = logische scheiding zonder fysieke bekabeling te wijzigen."},
{type:"multi",q:"Welke voordelen bieden VLANs? (meerdere antwoorden)",o:["Automatische encryptie van verkeer","Vereenvoudiging van netwerkbeheer","Flexibiliteit: gebruikers logisch indelen onafhankelijk van fysieke locatie","Verminderd broadcast-verkeer per VLAN","Beveiliging: verkeer van verschillende groepen gescheiden"],c:[4,3,2,1],h:"VLANs versleutelen NIET automatisch verkeer — dat is een andere beveiligingsmaatregel."},
{type:"mc",q:"Wat is het verschil tussen een access-poort en een trunk-poort?",o:["Trunk-poort = één VLAN; access-poort = meerdere VLANs","Access-poort is voor uplinks; trunk voor servers","Access-poort = één VLAN (voor eindapparaten); trunk-poort = meerdere VLANs (voor verbindingen tussen switches)","Ze zijn identiek"],c:[2],h:"Access = één VLAN voor eindgebruikersapparaten. Trunk = meerdere VLANs voor interswitch links."},
{type:"open",q:"Welke IEEE-standaard wordt gebruikt voor VLAN-tagging op trunk-poorten?",ans:["802.1q","ieee 802.1q","dot1q"],h:"De standaard begint met '802.1' en wordt ook 'dot1Q' genoemd."},
{type:"mc",q:"Wat is het 'native VLAN' op een trunk-poort?",o:["Het VLAN waarvan frames NIET worden getagged op de trunk-verbinding — typisch VLAN 1","Het enige VLAN dat de trunk-poort mag gebruiken","Het management VLAN","Het VLAN met de hoogste prioriteit"],c:[0],h:"Native VLAN = ongetagged verkeer. Beide kanten van de trunk moeten hetzelfde native VLAN hebben."},
{type:"mc",q:"Wat is inter-VLAN routing?",o:["Het automatisch aanmaken van VLANs","Het routeren van verkeer tussen twee of meer VLANs via een router of Layer 3 switch","Routing tussen twee switches","Het uitwisselen van VLAN-informatie tussen switches"],c:[1],h:"VLANs zijn gescheiden — ze kunnen niet direct communiceren. Een router of L3-switch overbrugt VLANs."},
{type:"mc",q:"Wat is een 'router-on-a-stick' configuratie?",o:["Een router met één netwerkkabel","Inter-VLAN routing via één fysieke router-interface met meerdere sub-interfaces (één per VLAN)","Een router die enkel als switch werkt","Een router met VLAN-ondersteuning op alle poorten"],c:[1],h:"Één fysieke interface, meerdere logische sub-interfaces — elk voor een ander VLAN. Efficiënt maar één bottleneck."},
{type:"mc",q:"Wat is een Layer 3 switch?",o:["Een switch met meer poorten","Een switch met ingebouwde routeringsfunctionaliteit die zowel op laag 2 (MAC) als laag 3 (IP) kan werken","Een switch die enkel op laag 3 werkt","Een router vermomd als switch"],c:[1],h:"L3 switch = switch + router. Kan inter-VLAN routing uitvoeren zonder aparte router."},
{type:"mc",q:"Wat is VTP (VLAN Trunking Protocol)?",o:["Een protocol voor inter-VLAN routing","Een Cisco-protocol dat VLAN-informatie automatisch distribueert tussen switches in een VTP-domein","Een protocol voor VLAN-tagging","Een standaard voor trunk-configuratie"],c:[1],h:"VTP = automatische VLAN-distributie. Configureer VLANs op de server, alle clients volgen automatisch."},
{type:"multi",q:"Welke VTP-modes bestaan er? (meerdere antwoorden)",o:["Master","Server","Client","Transparent","Off"],c:[1,2,3,4],h:"De vier officiële VTP-modes. 'Master' bestaat niet in VTP."},
{type:"mc",q:"Wat is een VLAN voor voice-verkeer (voice VLAN)?",o:["Een speciaal VLAN voor VoIP-telefoons met hogere prioriteit (QoS) voor lagere latency","Een VLAN zonder QoS","Een VLAN voor management-verkeer","Een VLAN voor draadloze apparaten"],c:[0],h:"VoIP is latency-gevoelig — een apart voice VLAN met QoS garandeert spraakkwaliteit."},
{type:"mc",q:"Wat is het doel van STP (Spanning Tree Protocol)?",o:["MAC-adressen leren","Lussen in het netwerk voorkomen door redundante paden te blokkeren terwijl redundantie behouden blijft","VLANs configureren op switches","Verkeer routeren tussen VLANs"],c:[1],h:"Lussen = broadcast storms. STP blokkeert redundante paden maar houdt ze als backup beschikbaar."},
{type:"mc",q:"Wat is een Root Bridge?",o:["De switch met het meeste verkeer","De switch die gekozen wordt als centraal referentiepunt van de spanning tree","De switch met de meeste poorten","De switch verbonden met het internet"],c:[1],h:"De Root Bridge is het 'hart' van de spanning tree — alle paden worden vanuit hier berekend."},
{type:"mc",q:"Hoe wordt de Root Bridge gekozen?",o:["De switch met de meeste verbindingen","De switch met de laagste Bridge ID (prioriteit + MAC-adres)","De switch met de meeste poorten","Manueel geconfigureerd door de beheerder"],c:[1],h:"Bridge ID = prioriteit (default 32768) + MAC-adres. Laagste = wint. Pas prioriteit aan om te sturen."},
{type:"open",q:"Hoe heet de STP-poorttoestand waarbij een poort actief forwardt maar geen paden naar de root heeft?",ans:["designated port","designated","designated poort"],h:"Niet de root port, maar de poort die op het segment de beste weg naar de root heeft."},
{type:"multi",q:"Welke STP-poorttoestanden zijn er in classiek STP? (meerdere antwoorden)",o:["Disabled","Forwarding","Learning","Listening","Blocking"],c:[4,3,2,1,0],h:"Alle vijf zijn officiële STP-poorttoestanden."},
{type:"mc",q:"Wat is RSTP (Rapid STP)?",o:["Een verouderde versie van STP","Een verbeterde versie van STP (802.1w) met snellere convergentie — seconden in plaats van 30-50 seconden","Een Cisco-proprietary versie van STP","Een protocol voor VLAN-tagging"],c:[1],h:"Rapid = snel. RSTP convergeert in seconden, klassiek STP duurt 30-50 seconden."},
{type:"mc",q:"Wat is PortFast in STP?",o:["Een feature die de STP-convergentie versnelt voor alle poorten","Een Cisco-feature die de STP-wachttijd (Listening/Learning) overslaat voor poorten verbonden met eindapparaten","Een type root bridge configuratie","Een feature om trunk-poorten te detecteren"],c:[1],h:"PortFast = direct in Forwarding voor access-poorten. Nooit op trunk-poorten — dat veroorzaakt lussen!"},
{type:"mc",q:"Wat is BPDU Guard?",o:["Versnelt STP-convergentie","Schakelt een PortFast-poort uit als er een BPDU binnenkomt (wat een switch aangeeft) — beschermt tegen onbedoelde lussen","Beschermt BPDU-pakketten tegen afluisteren","Een type VLAN-beveiliging"],c:[1],h:"Een BPDU op een PortFast-poort = iemand heeft een switch aangesloten. BPDU Guard schakelt de poort uit."},
{type:"mc",q:"Wat is PVST+ (Per-VLAN Spanning Tree Plus)?",o:["Een verouderde STP-versie","Eén STP-instantie voor alle VLANs","Een Cisco-variant waarbij per VLAN een aparte STP-instantie draait — meer controle over paden per VLAN","Een versie van STP voor laag 3 switches"],c:[2],h:"PVST+ = één spanning tree per VLAN. Je kunt per VLAN load-balancing doen over redundante links."},
{type:"mc",q:"Wat is een broadcast storm?",o:["Een periode van hoog broadcast-verkeer tijdens een piekuur","Een exponentieel toenemende hoeveelheid broadcasts door een netwerkluus — kan een netwerk volledig platleggen","Een type DDoS-aanval","Een fout in een routeringsprotocol"],c:[1],h:"Lus + broadcast = A stuurt naar B, B forwardt naar A, A forwardt naar B... eindeloos. STP voorkomt dit."},
{type:"mc",q:"Wat is DHCP?",o:["Domain Host Configuration Protocol","Dynamic Host Configuration Protocol — wijst automatisch IP-adressen en netwerkconfiguratie toe aan clients","Een type DNS-server","Een routeringsprotocol"],c:[1],h:"DHCP = automatische IP-configuratie. Geen manuele instelling nodig op clients."},
{type:"multi",q:"Welke informatie verstrekt een DHCP-server aan een client? (meerdere aanwezig)",o:["IP-adres","Subnetmasker","Default gateway","DNS-server","Naam van de netwerknbeheerder"],c:[0,1,2,3],h:"DHCP verstrekt: IP-adres, subnetmasker, default gateway, DNS-servers en soms meer (NTP, domain name)."},
{type:"multi",q:"Welke vier stappen omvat het DHCP-process (DORA)? (meerdere antwoorden)",o:["Discover","Offer","Request","Acknowledge","Confirm","Negotiate"],c:[0,1,2,3],h:"DORA = Discover, Offer, Request, Acknowledge. De vier stappen van DHCP-onderhandeling."},
{type:"mc",q:"Wat is een DHCP lease?",o:["Een contract met de DHCP-leverancier","De tijdsduur gedurende welke een client een IP-adres mag gebruiken","Een type IP-adres","Een DHCP-pool"],c:[1],h:"Na het verstrijken van de lease vraagt de client vernieuwing — of het adres wordt vrijgegeven."},
{type:"mc",q:"Wat is een DHCP-scope?",o:["Een type VLAN","De pool van IP-adressen die de DHCP-server kan uitdelen","De maximale duur van een lease","Een firewall-regel voor DHCP-verkeer"],c:[1],h:"Scope = pool. Je definieert het bereik (range) van adressen die de server mag toewijzen."},
{type:"mc",q:"Wat is een DHCP reservation?",o:["Een scope waarvoor DHCP uitgeschakeld is","Een vaste IP-adrestoewijzing aan een specifiek MAC-adres — het apparaat krijgt altijd hetzelfde IP","Een back-up van de DHCP-database","Een type VLAN-toewijzing via DHCP"],c:[1],h:"Reservation = statisch IP via DHCP op basis van MAC-adres. Beste van beide werelden."},
{type:"mc",q:"Wat is een DHCP relay agent?",o:["Een back-up DHCP-server","Een component op een router/switch die DHCP-broadcasts omzet naar unicast en doorstuurt naar een DHCP-server in een ander netwerksegment","Een type DHCP-client","Een DHCP-monitoring tool"],c:[1],h:"DHCP gebruikt broadcasts — broadcasts oversteken geen routers. Relay agent lost dit op."},
{type:"open",q:"Op welke UDP-poorten communiceert DHCP?",ans:["67 en 68","67, 68","68 en 67","udp 67 en 68"],h:"De server luistert op één poort, de client op een andere — beide zijn onder 100."},
{type:"mc",q:"Wat is DHCP snooping?",o:["Een aanvalstechniek op DHCP","Een beveiligingsfunctie op switches die valse DHCP-servers blokkeert door poorten te classificeren als trusted of untrusted","Een type DHCP-scope","Een monitoringfunctie voor DHCP-leases"],c:[1],h:"DHCP snooping vertrouwt enkel DHCP-antwoorden van de 'trusted' poort waar de echte server op zit."},
{type:"mc",q:"Wat is een DHCP conflict?",o:["Twee DHCP-servers die dezelfde scope hebben","Een IP-adres dat door de DHCP-server is uitgedeeld maar ook manueel gebruikt wordt — leidt tot IP-conflicten","Een fout in de DHCP-configuratie","Een DHCP-server die geen adressen meer heeft"],c:[1],h:"Conflict = zelfde IP voor twee apparaten. Gebruik reservations of sla manueel toegewezen IPs uit de scope."},
{type:"mc",q:"Wat is NAT?",o:["Network Access Technology","Network Address Translation — vertaalt private IP-adressen naar publieke IP-adressen voor internettoegang","Een type DNS-record","Een routeringsprotocol"],c:[1],h:"NAT = de vertaler. Private IPs zijn niet routeerbaar op het internet; NAT lost dit op."},
{type:"mc",q:"Wat is het verschil tussen PAT en NAT?",o:["Ze zijn identiek","PAT (Port Address Translation) = meerdere private IPs vertalen naar één publiek IP via poortnummers; NAT kan ook één-op-één vertaling doen","NAT gebruikt poorten; PAT niet","PAT is voor IPv6; NAT voor IPv4"],c:[1],h:"PAT = NAT overload. Eén publiek IP gedeeld door honderden interne apparaten dankzij poortnummers."},
{type:"mc",q:"Wat is statische NAT?",o:["Eén publiek IP gedeeld door meerdere interne IPs","Een vaste één-op-één mapping tussen een privaat en een publiek IP-adres","NAT met behulp van poorten","Tijdelijke NAT-vertalingen"],c:[1],h:"Statisch = permanent, vast. Nuttig voor servers die van buiten bereikbaar moeten zijn."},
{type:"mc",q:"Waarom is NAT een partiële beveiligingsoplossing?",o:["NAT versleutelt verkeer","NAT verbergt interne IP-adressen voor buitenstaanders, maar is geen vervanging voor een firewall","NAT blokkeert alle inkomende verbindingen","NAT detecteert aanvallen"],c:[1],h:"NAT = obscuring, geen security. Interne IPs zijn onzichtbaar maar NAT controleert geen verkeer inhoudelijk."},
{type:"mc",q:"Op welke OSI-laag werkt een router?",o:["Laag 1","Laag 2","Laag 3 (Network)","Laag 4"],c:[2],h:"Routers werken op IP-adressen — dat is de Network laag (laag 3)."},
{type:"mc",q:"Wat is een routeringstabel?",o:["Een tabel met MAC-adressen","Een tabel met bekende netwerken en de bijbehorende uitgangsinterface of next-hop router","Een ARP-tabel","Een VLAN-tabel"],c:[1],h:"De routeringstabel bepaalt: voor dit bestemmingsnetwerk, gebruik deze route."},
{type:"mc",q:"Wat is het verschil tussen statische en dynamische routering?",o:["Ze zijn identiek","Statisch = routes manueel geconfigureerd; dynamisch = routes automatisch uitgewisseld via routeringsprotocollen","Dynamisch is altijd trager","Statisch werkt alleen in grote netwerken"],c:[1],h:"Statisch = manueel, eenvoudig maar onflexibel. Dynamisch = automatisch, schaalbaar maar complexer."},
{type:"mc",q:"Wat is een default route?",o:["De snelste route naar een bestemming","Een route die wordt gebruikt als er geen specifiekere route bestaat — 'de uitgang als je het niet weet'","De route naar het lokale netwerk","Een back-up route"],c:[1],h:"0.0.0.0/0 = default route. Als niets anders matcht: ga hier naartoe."},
{type:"mc",q:"Wat is 'longest prefix match' in routering?",o:["De router kiest altijd de kortste route","De router kiest de route met het meest specifieke subnetmasker (langste prefix) dat overeenkomt met het bestemmingsadres","De router kiest de route met de laagste metric","De router kiest de eerste overeenkomende route"],c:[1],h:"Specifiekere route wint altijd. /24 wint van /16 als beide overeenkomen met het bestemmingsadres."},
{type:"mc",q:"Wat is OSPF?",o:["Een type VPN-protocol","Open Shortest Path First — een link-state routeringsprotocol dat de kortste paden berekent via Dijkstra's algoritme","Een DHCP-variant","Een type VLAN-protocol"],c:[1],h:"OSPF = open standaard, link-state, intern routeringsprotocol (IGP)."},
{type:"multi",q:"Welke zijn Interior Gateway Protocols (IGP)? (meerdere antwoorden)",o:["OSPF","RIP","EIGRP","BGP","IS-IS"],c:[0,1,2,4],h:"BGP is een Exterior Gateway Protocol (EGP) — gebruikt tussen autonome systemen op het internet."},
{type:"mc",q:"Wat is het verschil tussen een Layer 2 en Layer 3 switch?",o:["Een Layer 3 switch heeft meer poorten","Een Layer 2 switch werkt enkel op MAC-adressen; een Layer 3 switch heeft ook routeringsfunctionaliteit en werkt op IP","Een Layer 2 switch is sneller","Een Layer 3 switch is ook een firewall"],c:[1],h:"L3 switch = switch + router. Intern: ASIC-gebaseerd routing is veel sneller dan een traditionele router."},
{type:"mc",q:"Wat is een 'choke point' in een netwerktopologie?",o:["Een kwetsbaar punt","Een geforceerd doorvoerpunt waar al het verkeer langs moet, ideaal voor filtering en monitoring","Een backup-router","Een redundante verbinding"],c:[1],h:"Choke point = bewust één punt creëren. Alle verkeer langs één punt = makkelijker te monitoren."},
{type:"mc",q:"Wat is port security op een switch?",o:["Het beveiligen van de switch-behuizing","Een feature die het aantal en de identiteit van MAC-adressen per poort beperkt — blokkeert onbevoegde apparaten","Een type VLAN","Een firewall op de switch"],c:[1],h:"Port security = slechts X MAC-adressen mogen op deze poort verschijnen."},
{type:"mc",q:"Wat is 802.1X?",o:["De VLAN-tagging standaard","Een IEEE-standaard voor port-based Network Access Control — vereist authenticatie voor netwerktoegang","Een STP-variant","Een type Wi-Fi-beveiliging"],c:[1],h:"802.1X = authenticeer jezelf voor je het netwerk betreedt. Gebruikt EAP en een RADIUS-server."},
{type:"mc",q:"Wat is een ACL (Access Control List) op een router?",o:["Een lijst van gebruikers","Een reeks regels die bepalen welk verkeer door een router-interface wordt toegelaten of geblokkeerd op basis van IP-adressen en poortnummers","Een routeringstabel","Een VLAN-toewijzing"],c:[1],h:"ACL = filterregels op de router. Standard ACL filtert op source IP; Extended ACL op meer criteria."},
{type:"mc",q:"Wat is het verschil tussen een Standard en Extended ACL?",o:["Ze zijn identiek","Standard ACL filtert alleen op bron-IP; Extended ACL filtert op bron-IP, doel-IP, protocol en poort","Extended ACL is verouderd","Standard ACL is complexer"],c:[1],h:"Extended = meer parameters. Meer controle maar ook meer complex."},
{type:"mc",q:"Hoe beveilig je de console-poort van een switch?",o:["Via een VLAN","Via een wachtwoord op de console-lijn (line console 0 → password → login)","Via SSH","Via een ACL"],c:[1],h:"Console = fysieke toegang. Beveilig met een wachtwoord op de console-lijn."},
{type:"open",q:"Welk protocol gebruik je voor beveiligde remote toegang tot een switch of router in plaats van Telnet?",ans:["ssh","secure shell"],h:"Het vervangt Telnet omdat het al het verkeer versleutelt."},
{type:"mc",q:"Waarom is Telnet onveilig voor switch/router-beheer?",o:["Telnet is te traag","Telnet stuurt alle data inclusief wachtwoorden in plaintext — afluisterbaar via MitM of sniffing","Telnet werkt niet op moderne hardware","Telnet heeft geen authenticatie"],c:[1],h:"Plaintext = onversleuteld. Alles wat je typt is leesbaar voor iemand op het netwerk."},
{type:"mc",q:"Wat is VLAN hopping?",o:["Het wisselen van VLAN voor een apparaat","Een aanval waarbij een aanvaller toegang krijgt tot een ander VLAN zonder autorisatie, bijv. via double tagging","Het samenvoegen van twee VLANs","Een type inter-VLAN routing"],c:[1],h:"VLAN hopping = beveiligingsprobleem. Schaf het native VLAN af of gebruik VLAN 999 als unused native VLAN."},
{type:"multi",q:"Welke maatregelen neem je om een switch te beveiligen? (meerdere antwoorden)",o:["Poorten niet in gebruik uitschakelen","Default wachtwoorden wijzigen","VLAN 1 als management VLAN vermijden","Telnet vervangen door SSH","Alle wachtwoorden in plaintext opslaan"],c:[0,1,2,3],h:"Eén optie is een ernstige beveiligingsfout die je juist moet vermijden."},
{type:"mc",q:"Een apparaat stuurt een frame naar MAC ff:ff:ff:ff:ff:ff. Wat doet de switch?",o:["Het frame wordt weggegooid","Het frame wordt geflooded naar alle poorten behalve de inkomende","Het frame wordt naar de router gestuurd","Het frame wordt teruggestuurd"],c:[1],h:"ff:ff:ff:ff:ff:ff = broadcast MAC-adres. Broadcasts gaan naar iedereen."},
{type:"mc",q:"Twee apparaten in hetzelfde VLAN maar op verschillende switches communiceren. Wat is nodig?",o:["Een router","Een trunk-link tussen de twee switches die het VLAN draagt","Een aparte switch","Een DHCP-server"],c:[1],h:"VLAN-verkeer over meerdere switches = trunk-link nodig met 802.1Q tagging."},
{type:"mc",q:"Een apparaat in VLAN 10 wil communiceren met een apparaat in VLAN 20. Wat is nodig?",o:["Niets — VLANs kunnen altijd direct communiceren","Een router of Layer 3 switch voor inter-VLAN routing","Een trunk-poort","Een extra switch"],c:[1],h:"VLANs zijn gescheiden. Voor communicatie tussen VLANs is laag 3 (routering) nodig."},
{type:"mc",q:"Een switch-poort blijft in Blocking-state ondanks dat er een apparaat op aangesloten is. Wat is de meest waarschijnlijke oorzaak?",o:["De switch heeft geen stroom","STP heeft deze poort geblokkeerd om een lus te voorkomen — activeer PortFast als het een access-poort is","De poort is kapot","VLAN is verkeerd geconfigureerd"],c:[1],h:"Blocking = STP doet zijn werk. PortFast slaat de wachttijd over voor eindapparatuur-poorten."},
{type:"mc",q:"Je hebt 3 switches in een ring verbonden. Wat is het gevaar en hoe los STP dit op?",o:["Geen gevaar","Lus-gevaar: broadcasts circuleren oneindig. STP detecteert de lus en blokkeert één redundante poort","Snelheidsproblemen","IP-conflicten"],c:[1],h:"Ring = redundantie + lus. STP blokkeert één pad zodat er geen lus is maar redundantie bewaard blijft."},
{type:"mc",q:"Een DHCP-server staat in VLAN 100. Clients staan in VLAN 10 en 20. Hoe bereiken de clients de DHCP-server?",o:["Via een apart netwerk","Via een DHCP relay agent geconfigureerd op de router of L3-switch","Rechtstreeks via VLAN-doorgang","Dit is niet mogelijk"],c:[1],h:"DHCP gebruikt broadcasts die VLAN-grenzen niet oversteken. Relay agent stuurt het door als unicast."},
{type:"mc",q:"Je configureert een router-on-a-stick voor VLANs 10 en 20. Hoeveel fysieke interfaces heb je minimaal nodig op de router?",o:["Drie (één per VLAN + één voor management)","Vier","Twee (één per VLAN)","Eén (met twee sub-interfaces)"],c:[3],h:"Router-on-a-stick = één fysieke interface met meerdere sub-interfaces (bijv. G0/0.10 en G0/0.20)."},
{type:"mc",q:"Een aanvaller sluit een onbeheerde switch aan op een bedrijfsnetwerk. Welk gevaar brengt dit mee voor STP?",o:["IP-conflicten ontstaan","Het netwerk vertraagt","De onbeheerde switch kan hogere STP-prioriteit claimen en root bridge worden, waarna verkeer via de aanvaller stroomt","Geen gevaar"],c:[2],h:"STP mangling: de aanvaller manipuleert STP om root bridge te worden. BPDU Guard beschermt hiertegen."},
{type:"mc",q:"Wat is de function van een 'uplink' poort op een switch?",o:["Een PoE-poort","Een poort voor draadloze apparaten","Een poort enkel voor servers","Een hogere-capaciteits poort voor verbindingen tussen switches of naar de kern van het netwerk"],c:[3],h:"Uplink = naar boven in de hiërarchie. Typisch hogere snelheid (1G of 10G) voor aggregatie."},
{type:"mc",q:"Welk commando geeft je op een Cisco switch een overzicht van alle VLANs?",o:["show interfaces trunk","show mac address-table","show ip route","show vlan brief"],c:[3],h:"'show vlan brief' toont alle geconfigureerde VLANs met hun naam en member-poorten."},
{type:"open",q:"Wat is de default STP bridge prioriteit op Cisco switches?",ans:["32768"],h:"Het is een macht van 2, namelijk 2 tot de 15de macht."},
{type:"mc",q:"Wat doet het commando 'switchport mode trunk' op een Cisco switch?",o:["Schakelt STP uit op de poort","Configureert de poort als management interface","Schakelt de poort in access mode","Configureert de poort als trunk — draagt verkeer van meerdere VLANs met 802.1Q tagging"],c:[3],h:"Trunk mode = meerdere VLANs via één fysieke link met VLAN-tags."},
{type:"mc",q:"Welk commando gebruik je om een VLAN aan te maken op een Cisco switch?",o:["add vlan 10","interface vlan 10","create vlan 10","vlan 10 (in global config mode)"],c:[3],h:"In globale configuratiemodus: 'vlan 10' gevolgd door optioneel 'name [naam]'."},
{type:"mc",q:"Wat is een floating static route?",o:["Een route zonder next-hop","Een type dynamische route","Een back-up statische route met hogere administrative distance die enkel actief wordt als de primaire route wegvalt","Een route die automatisch wordt berekend"],c:[2],h:"Floating static = hogere AD dan de primaire route. Blijft 'zweven' tot de primaire verdwijnt."},
{type:"mc",q:"Wat is administrative distance (AD)?",o:["De bandbreedte van een link","De kost van een route","De afstand in meters van de router","Een waarde die de betrouwbaarheid van een routeringsbron aangeeft — lagere AD = hogere voorkeur"],c:[3],h:"AD: Connected=0, Static=1, OSPF=110, RIP=120. Lagere waarde = meer vertrouwd."},
{type:"mc",q:"Wat is een 'metric' in routeringsprotocollen?",o:["De verwerkingskracht van de router","De routeringstabelgrootte","De waarde die bepaalt welke route het beste is als er meerdere routes naar hetzelfde netwerk zijn","De AD van een route"],c:[2],h:"Metric = hoe goed is deze route? OSPF gebruikt cost (bandbreedte), RIP gebruikt hop count."},
{type:"mc",q:"Wat is de metric die OSPF gebruikt?",o:["Delay","MTU","Hop count","Cost — gebaseerd op bandbreedte van de link (hogere bandbreedte = lagere cost)"],c:[3],h:"OSPF cost = 100Mbps / link_bandbreedte. Gigabit link (1Gbps) = cost 1. FastEthernet (100Mbps) = cost 1."},
{type:"mc",q:"Wat is de metric die RIP gebruikt?",o:["Bandbreedte","Delay","Cost","Hop count — maximaal 15 hops, hop 16 = onbereikbaar"],c:[3],h:"RIP = telroutes. Meer dan 15 routers tussen bron en doel = onbereikbaar. Limiteert netwerkomvang."},
{type:"mc",q:"Wat is een 'routing loop' en hoe voorkomen routeringsprotocollen dit?",o:["Een type VLAN-probleem","Een type broadcast storm","Een type STP-probleem","Pakketten die oneindig rondcirkelen — voorkomen via split horizon, route poisoning en hold-down timers"],c:[3],h:"Routing loop = circular: A→B→C→A→... Pakketten reizen nooit aan. TTL beperkt de schade."},
{type:"mc",q:"Wat is 'split horizon'?",o:["Een type NAT-configuratie","Een type VLAN-techniek","Een RIP-regel: stuur geen route-informatie terug via de interface waarlangs je die informatie ontvangen hebt","Een type STP-beveiliging"],c:[2],h:"Split horizon = stuur niet terug waar je het vandaan hebt. Voorkomt eenvoudige routing loops."},
{type:"mc",q:"Wat is EIGRP?",o:["Een type spanning tree protocol","Een Cisco-proprietary advanced distance-vector routeringsprotocol dat bandbreedte, delay, load en reliability als metric gebruikt","Een open standaard routeringsprotocol","Een type VLAN-protocol"],c:[1],h:"EIGRP = Cisco's eigen protocol. Combineert distance-vector en link-state eigenschappen. Zeer snel convergerend."},
{type:"mc",q:"Wat is BGP en waar wordt het gebruikt?",o:["Een type VLAN-protocol","Border Gateway Protocol — het routeringsprotocol van het internet dat verkeer route tussen autonome systemen","Een intern routeringsprotocol","Een type STP-variant"],c:[1],h:"BGP = het 'ruggengraat'-protocol van het internet. Elke ISP spreekt BGP met andere ISPs."},
{type:"mc",q:"Wat is een autonome systeem (AS) in routering?",o:["Een type subnet","Een netwerk of groep netwerken onder één enkel administratief beheer met een gemeenschappelijk routeringsbeleid","Een zelfstandige router","Een type VLAN"],c:[1],h:"AS = één administratieve eenheid. Bedrijven en ISPs hebben elk hun eigen AS-nummer."},
{type:"mc",q:"Wat is VLSM (Variable Length Subnet Masking)?",o:["Een type routeringsprotocol","Een type NAT","Het gebruik van verschillende subnetmaskers voor subnetten van hetzelfde netwerk om IP-adressen efficiënt te verdelen","Een type VLAN-techniek"],c:[2],h:"VLSM = flexibele subnetting. /30 voor point-to-point links, /24 voor kantoren — optimaal adresgebruik."},
{type:"mc",q:"Wat is subnetting?",o:["Een type NAT","Een type VLAN","Het verdelen van een netwerk in kleinere subnetwerken door bits van het host-gedeelte te 'lenen' voor het netwerk-gedeelte","Het samenvoegen van netwerken"],c:[2],h:"Subnetten = opdelen. Eén groot /16 netwerk opdelen in 256 /24 subnetten voor verschillende afdelingen."},
{type:"mc",q:"Wat is het doel van CIDR (Classless Inter-Domain Routing)?",o:["Een type VLAN","Een type NAT","Flexibele IP-adressering zonder vaste klassen (A/B/C) — maakt efficiëntere adresverdeling en route aggregatie mogelijk","Een type routeringsprotocol"],c:[2],h:"CIDR = voorbij de klassen. /22 in plaats van altijd /8, /16 of /24. Meer flexibiliteit, minder verspilling."},
{type:"mc",q:"Wat is route summarization (route aggregation)?",o:["Een type VLAN","Een type NAT","Het samenvatten van meerdere specifieke routes in één minder specifieke route — verkleint routeringstabellen","Het uitbreiden van een route"],c:[2],h:"10.0.0.0/24, 10.0.1.0/24, 10.0.2.0/24, 10.0.3.0/24 → samengevat als 10.0.0.0/22."},
{type:"mc",q:"Wat is een point-to-point link en welk subnetmasker gebruik je typisch?",o:["Een type trunk","Een type VLAN","Een directe verbinding tussen twee routers — /30 of /31 omdat je slechts twee adressen nodig hebt","Een verbinding voor veel hosts, /24"],c:[2],h:"/30 = 4 adressen: netwerk, 2 hosts, broadcast. /31 = 2 adressen voor point-to-point (RFC 3021)."},
{type:"mc",q:"Wat is een loopback interface op een router?",o:["Een type trunk-interface","Een virtuele interface zonder fysieke kabel die altijd actief is — nuttig als router-ID, management interface en voor testen","Een interface voor lokaal verkeer","Een type VLAN-interface"],c:[1],h:"Loopback = altijd Up/Up. Ideaal als stabiele router-ID voor OSPF/BGP en als management-adres."},
{type:"mc",q:"Wat is OSPF Area 0?",o:["Een type AS","Een type OSPF-configuratie","De backbone area van OSPF — alle andere areas moeten direct of via virtual links verbonden zijn met area 0","Een optioneel OSPF-gebied"],c:[2],h:"Area 0 = het centrum. Alle inter-area verkeer loopt via area 0. Vergelijkbaar met een hub-and-spoke."},
{type:"mc",q:"Wat is een OSPF designated router (DR)?",o:["De root bridge van OSPF","De router met het laagste router-ID","De router met de meeste routes","Op een multi-access netwerk (bijv. Ethernet) de router die als centraal punt fungeert voor LSA-uitwisseling — vermindert OSPF-overhead"],c:[3],h:"DR/BDR = efficiëntie op shared media. Niet elke router praat met elke andere — enkel met DR/BDR."},
{type:"mc",q:"Wat is een 'hello packet' in OSPF?",o:["Een type STP-bericht","Een type ARP-bericht","Een OSPF-pakket dat periodiek verstuurd wordt om neighborships te onderhouden en dead intervals te detecteren","Een type ICMP-bericht"],c:[2],h:"Hello = ik leef nog. OSPF neighbors verwachten regelmatig hello-pakketten. Geen hello = link dood."},
{type:"mc",q:"Wat is een OSPF neighbour relationship?",o:["Een type STP-relatie","Een bijdirectionale OSPF-communicatierelatie tussen twee routers die OSPF hello-pakketten uitwisselen via een gedeelde interface","Een type VLAN-relatie","Een type BGP-sessie"],c:[1],h:"Neighbor = OSPF-partner. Neighbors wisselen LSAs (topologie-informatie) uit."},
{type:"mc",q:"Wat is een LSA (Link State Advertisement) in OSPF?",o:["Een type SNMP-trap","Een type BGP-update","Een type ARP-aankondiging","Een pakket dat topologie-informatie bevat die OSPF routers uitwisselen om hun netwerktopologie te synchroniseren"],c:[3],h:"LSA = bouwsteen van de OSPF topologie-database. Elke router kent alle LSAs in zijn area."},
{type:"mc",q:"Wat is een routing table vs. een forwarding table?",o:["Forwarding table is groter","Routing table is in hardware","Ze zijn identiek","Routing table = logische weergave van bekende netwerken; forwarding table = geoptimaliseerde hardware-tabel voor snelle pakketdoorstuur"],c:[3],h:"Routing table = software (show ip route). Forwarding table = hardware (CEF/FIB) voor lijnsnelheid forwarding."},
{type:"mc",q:"Wat is Cisco Express Forwarding (CEF)?",o:["Een type VLAN","Een type STP","Een Cisco hardware-acceleratietechnologie die een FIB en adjacency table gebruikt voor lijnsnelheid pakketdoorstuur","Een type routeringsprotocol"],c:[2],h:"CEF = fast forwarding. De router hoeft niet elke route-opzoeking software-matig te doen."},
{type:"mc",q:"Wat is een 'null route' of 'black hole route'?",o:["Een type floating static route","Een type default route","Een route die pakketten weggooit — nuttig als veiligheidsnet om pakketten naar niet-bestaande bestemmingen te droppen","Een route zonder bestemming"],c:[2],h:"Null0 interface = black hole. ip route 10.0.0.0 255.0.0.0 Null0 = gooi alle pakketten naar dit netwerk weg."},
{type:"mc",q:"Wat is IP SLA in Cisco-configuratie?",o:["Een type VLAN-functie","Een type QoS-functie","Een type beveiligingspolicy","Een Cisco-feature die continu connectiviteit en performance meet (ping, HTTP, TCP) en acties kan triggeren op basis van resultaten"],c:[3],h:"IP SLA = actieve monitoring vanuit de router. Combineer met floating static routes voor automatische failover."},
{type:"mc",q:"Wat is QoS (Quality of Service)?",o:["Een type VLAN","Een type routeringsprotocol","Mechanismen die bepaald verkeer prioriteit geven over het netwerk — essentieel voor VoIP en video","Een type beveiliging"],c:[2],h:"QoS = verkeersprioriteit. VoIP-pakketten voor data-backup-pakketten. Latency en jitter minimaliseren."},
{type:"mc",q:"Wat is DSCP (Differentiated Services Code Point)?",o:["Een type routeringsprotocol","Een 6-bit markering in de IP-header die de QoS-klasse aangeeft voor prioriteitsbehandeling","Een type VLAN-tag","Een type IP-adres"],c:[1],h:"DSCP = QoS-markering in het IP-pakket. EF (46) = hoogste prioriteit voor VoIP. CS0 = standaard."},
{type:"mc",q:"Wat is MPLS?",o:["Multi-Protocol Link State","Multiprotocol Label Switching — verkeer wordt op basis van labels (niet IP-adressen) doorgestuurd voor hoge snelheid en traffic engineering","Een type VPN","Een type routeringsprotocol"],c:[1],h:"MPLS = label-based forwarding. Sneller dan IP-lookup, nuttig voor grote service provider netwerken."},
{type:"mc",q:"Wat is een GRE tunnel?",o:["Een type encryptie","Generic Routing Encapsulation — een tunnelprotocol dat pakketten inpakt zodat ze via netwerken kunnen reizen die het originele protocol niet ondersteunen","Een type VPN","Een type VLAN"],c:[1],h:"GRE = generieke tunnel. IPv6 over IPv4 netwerk? GRE tunnel. Multicast over WAN? GRE tunnel."},
{type:"mc",q:"Wat is het verschil tussen een routed port en een SVI op een L3 switch?",o:["Ze zijn identiek","Routed port = geen VLAN, fungeert als router-interface; SVI (VLAN interface) = virtuele interface voor een VLAN, voor inter-VLAN routing","SVI heeft meer bandbreedte","Routed port ondersteunt meer protocols"],c:[1],h:"SVI (interface VlanX) = de gateway voor hosts in VLAN X. Routed port = verbinding naar andere routers."},
{type:"mc",q:"Wat is CDP (Cisco Discovery Protocol)?",o:["Een type routeringsprotocol","Een Cisco-proprietary laag 2 protocol dat informatie uitwisselt tussen direct verbonden Cisco-apparaten (interfaces, modellen, OS-versies)","Een type VLAN-protocol","Een type STP-variant"],c:[1],h:"CDP = Cisco-burenprotocol. Zie welke apparaten direct verbonden zijn zonder in te loggen. Schakel uit naar buiten."},
{type:"mc",q:"Wat is LLDP (Link Layer Discovery Protocol)?",o:["Een type STP","De open standaard equivalent van CDP — laat apparaten van verschillende fabrikanten elkaars informatie uitwisselen","Een type OSPF","Een type VLAN-protocol"],c:[1],h:"LLDP = open CDP-alternatief. IEEE 802.1AB. Werkt ook tussen Cisco en niet-Cisco apparaten."},
{type:"mc",q:"Wat is port mirroring (SPAN)?",o:["Het dupliceren van een poort","Een switch-feature die al het verkeer van één of meerdere poorten kopieert naar een analyse-poort voor monitoring/troubleshooting","Een type VLAN","Een type trunk"],c:[1],h:"SPAN = maak een kopie van verkeer voor een sniffer. Zie wat er langs gaat zonder het netwerk te onderbreken."},
{type:"mc",q:"Wat is een EtherChannel (Link Aggregation)?",o:["Een type VLAN","Het bundelen van meerdere fysieke links tot één logische link voor hogere bandbreedte en redundantie","Een type STP-feature","Een type trunk"],c:[1],h:"EtherChannel = 4 × 1Gbps links = 4Gbps logische link. Hoge beschikbaarheid + hogere throughput."},
{type:"mc",q:"Wat is LACP (Link Aggregation Control Protocol)?",o:["Een type routeringsprotocol","Het open standaard protocol (IEEE 802.3ad) voor automatische negotiatie van EtherChannel-links","Een type STP","Een type VLAN-protocol"],c:[1],h:"LACP = open standaard voor link aggregation. PAgP is Cisco-proprietary equivalent."},
{type:"mc",q:"Wat is storm control op een switch?",o:["Een type beveiliging tegen DDoS","Een feature die het volume van broadcast, multicast en unicast-verkeer per poort beperkt om storm-situaties te voorkomen","Een type STP-feature","Een type VLAN-functie"],c:[1],h:"Storm control = bescherm het netwerk tegen broadcast storms door een drempelwaarde in te stellen per poort."},
{type:"mc",q:"Wat is dynamic ARP inspection (DAI)?",o:["Een type ARP-monitoring","Een beveiligingsfunctie die ARP-pakketten valideert via de DHCP snooping binding table om ARP poisoning te voorkomen","Een type VLAN-beveiliging","Een type STP-beveiliging"],c:[1],h:"DAI = valideer ARP-pakketten. Als MAC+IP niet overeenkomt met de DHCP lease database → drop het pakket."},
{type:"mc",q:"Wat is IP source guard?",o:["Een type firewall","Een beveiligingsfunctie die IP-pakketten valideert op basis van de DHCP snooping binding table om IP-adres spoofing te voorkomen","Een type NAT","Een type VLAN"],c:[1],h:"IP source guard = valideer source IP. Pakketten met onbekend IP op een poort worden gedropped."},
{type:"mc",q:"Wat is het doel van het 'spanning-tree portfast' commando?",o:["Versnelt STP-convergentie voor alle poorten","Laat de poort onmiddellijk de Forwarding state ingaan zonder de normale STP-states te doorlopen — alleen voor access-poorten met eindapparaten","Schakelt STP uit","Verhoogt de prioriteit van de poort"],c:[1],h:"PortFast = skip Listening/Learning. Direkt Forwarding. Alleen op poorten naar eindapparaten, nooit naar switches!"},
{type:"mc",q:"Wat is 'show mac address-table' op een Cisco switch?",o:["Toont de routeringstabel","Toont de CAM-table: welke MAC-adressen zijn bekend op welke poorten","Toont de ARP-tabel","Toont de VLAN-configuratie"],c:[1],h:"show mac address-table = kijk in de 'hersenen' van de switch. Nuttig voor troubleshooting."},
{type:"mc",q:"Wat is een 'wildcard mask' in OSPF en ACLs?",o:["Het inverse van het subnetmasker","Een masker dat aangeeft welke bits van een IP-adres gecontroleerd worden — 0=controleer, 1=negeer (inverse van subnetmasker)","Het subnetmasker zelf","Een type routeringsfilter"],c:[1],h:"Wildcard = inverse subnetmasker. /24 subnetmasker 255.255.255.0 → wildcard 0.0.0.255."},
{type:"mc",q:"Wat is PVLAN (Private VLAN)?",o:["Een persoonlijk VLAN","Een VLAN-variant die isolatie biedt tussen poorten in hetzelfde VLAN — nuttig voor hosting waar klanten elkaars servers niet mogen bereiken","Een type trunk","Een type management VLAN"],c:[1],h:"PVLAN = isolatie binnen een VLAN. Promiscuous port (router) praat met iedereen; isolated ports niet met elkaar."},
{type:"mc",q:"Wat is Multi-Chassis EtherChannel (MLAG/vPC)?",o:["EtherChannel over meerdere kabels","EtherChannel waarvan de links verdeed zijn over twee fysiek aparte switches voor maximale redundantie","Een type STP","Een type VLAN"],c:[1],h:"MLAG/vPC = EtherChannel over twee switches. Geen single point of failure. Switch A falt? Switch B neemt over."},
{type:"mc",q:"Wat is het commando 'show ip route' op een Cisco router?",o:["Toont de interfaces","Toont de routeringstabel met alle bekende netwerken en hun next-hop/interface","Toont de ARP-tabel","Toont de OSPF-neighbors"],c:[1],h:"show ip route = de routeringstabel. C=Connected, S=Static, O=OSPF, R=RIP. Essentieel voor troubleshooting."},
{type:"mc",q:"Wat is 'traceroute' en waarvoor gebruik je het?",o:["Een ping-variant","Een tool die het pad toont dat pakketten volgen van bron naar doel — toont elke hop/router onderweg","Een type monitoring","Een type netwerkscan"],c:[1],h:"Traceroute = volg het pad. Nuttig om te zien waar in het netwerk connectivity wegvalt."},
{type:"mc",q:"Wat is het TTL-veld in een IP-pakket?",o:["Transporttijd in seconden","Time to Live — een teller die bij elke router met 1 verlaagd wordt; als TTL=0 wordt het pakket weggegooid","De prioriteit van het pakket","De grootte van het pakket"],c:[1],h:"TTL = max router hops. Voorkomt dat pakketten eeuwig rondcirkelen in een routing loop."},
{type:"mc",q:"Wat is een ARP table op een router?",o:["Een routeringstabel","Een tabel die IP-adressen koppelt aan MAC-adressen van direct verbonden apparaten — nodig voor frame-encapsulatie","Een type VLAN-tabel","Een type CAM-table"],c:[1],h:"ARP table = IP→MAC mapping. De router weet welk MAC-adres bij elk direct verbonden IP-adres hoort."},
{type:"mc",q:"Wat is het verschil tussen unicast, multicast en broadcast?",o:["Ze zijn identiek","Unicast = één ontvanger; multicast = groep ontvangers die zich ingeschreven hebben; broadcast = alle apparaten in het broadcast-domein","Broadcast = één ontvanger; unicast = iedereen","Multicast = alle ontvangers"],c:[1],h:"Unicast: één-op-één. Multicast: één-op-groep (efficiënter dan broadcast). Broadcast: één-op-allen."},
{type:"mc",q:"Wat is IGMP (Internet Group Management Protocol)?",o:["Een type routeringsprotocol","Een protocol waarmee hosts zichzelf inschrijven bij en uitschrijven uit multicast-groepen","Een type STP","Een type VLAN-protocol"],c:[1],h:"IGMP = multicast group management. Routers gebruiken IGMP om te weten welke hosts welke multicast-streams willen."},
{type:"mc",q:"Wat is een 'access list' op een router en wat is de standaard actie?",o:["Een lijst van toegestane gebruikers","Een reeks permit/deny regels voor IP-verkeer — de impliciete standaard actie is DENY (alle niet-gematched verkeer wordt geweigerd)","Een type routeringsfilter","Een type VLAN-toewijzing"],c:[1],h:"ACL heeft altijd een impliciete 'deny all' aan het einde. Vergeet je een permit → alles geblokkeerd."},
{type:"mc",q:"Wat is het verschil tussen inbound en outbound ACL toepassing op een interface?",o:["Er is geen verschil","Inbound: filtert verkeer dat de interface INKOMT; Outbound: filtert verkeer dat de interface VERLAAT","Outbound is efficiënter","Inbound werkt niet op routers"],c:[1],h:"Inbound ACL = verkeer dat de router binnenkomt. Outbound = verkeer dat de router verlaat. Locatie bepaalt efficiency."},
{type:"mc",q:"Wat is een 'standard numbered ACL' op Cisco?",o:["ACL nummer 100-199","ACL nummer 1-99 die filtert op ALLEEN source IP-adres","Een type extended ACL","Een type named ACL"],c:[1],h:"Standard ACL (1-99) = enkel source IP. Extended ACL (100-199) = source+dest IP, protocol, poort."},
{type:"mc",q:"Wat is een 'named ACL'?",o:["Een ACL met een naam","Een ACL die aangeduid wordt met een naam in plaats van een nummer — makkelijker te beheren en bevat ook sequence numbers voor rij-aanpassing","Een type standaard ACL","Een type extended ACL"],c:[1],h:"Named ACL = onderhoudsvriendelijk. Je kunt regels toevoegen/verwijderen op specifieke posities via sequence numbers."},
{type:"mc",q:"Wat is het RFC 1918-adresruimte?",o:["Publieke IP-adressen","Privé IP-adressen die niet routeerbaar zijn op het internet: 10.x.x.x, 172.16-31.x.x, 192.168.x.x","IPv6-adressen","Multicast-adressen"],c:[1],h:"RFC 1918 = privé-adressen. Achter NAT zijn miljoenen apparaten met 192.168.x.x adressen."},
{type:"mc",q:"Wat is IPv6 en welk probleem lost het op?",o:["Een nieuwe versie van OSPF","De opvolger van IPv4 met 128-bit adressen die het adresuitputtingsprobleem van IPv4 (32-bit) oplost","Een type routeringsprotocol","Een type VPN"],c:[1],h:"IPv6 = 128-bit = 340 undeciljoen adressen. IPv4 had 4.3 miljard adressen — uitgeput in 2011."},
{type:"mc",q:"Wat is een IPv6 link-local adres?",o:["Een publiek IPv6-adres","Een automatisch geconfigureerd IPv6-adres geldig enkel op het lokale netwerksegment (prefix fe80::/10) — nodig voor NDP","Een type multicast-adres","Een type anycast-adres"],c:[1],h:"Link-local = FE80::/10. Automatisch geconfigureerd op elke IPv6-interface. Niet routeerbaar."},
{type:"mc",q:"Wat is NDP (Neighbor Discovery Protocol) in IPv6?",o:["Een type routeringsprotocol","Het IPv6-equivalent van ARP — ontdekt buren, resolveert MAC-adressen en detecteert duplicate adressen","Een type DNS-protocol","Een type DHCP-protocol"],c:[1],h:"NDP = ARP voor IPv6. Gebruikt multicast i.p.v. broadcast. Ook voor router discovery en SLAAC."},
{type:"mc",q:"Wat is SLAAC (Stateless Address Autoconfiguration) in IPv6?",o:["Een type DHCP","Een mechanisme waarbij IPv6-apparaten zichzelf automatisch configureren op basis van router advertisements zonder DHCPv6-server","Een type NDP-functie","Een type routeringsprotocol"],c:[1],h:"SLAAC = zelfconfiguratie. Router advertiseert prefix → apparaat combineert met zijn EUI-64 MAC → volledig adres."},
{type:"mc",q:"Wat is het verschil tussen router advertisement en router solicitation in NDP?",o:["Ze zijn identiek","Router advertisement (RA): router stuurt prefix-info; Router solicitation (RS): host vraagt om een RA","RS is van router; RA van host","RA is ouder dan RS"],c:[1],h:"Host stuurt RS → router reageert met RA → host configureert zijn adres via SLAAC."},
{type:"mc",q:"Wat is het doel van 'show interfaces' op een Cisco switch/router?",o:["Toont de routeringstabel","Toont gedetailleerde informatie over alle interfaces: status, errors, bandbreedte, input/output statistieken","Toont de VLAN-tabel","Toont de ARP-tabel"],c:[1],h:"show interfaces = alles over een interface. Input errors, CRC errors, collisions — essentieel voor troubleshooting."},
{type:"mc",q:"Wat is een 'duplex mismatch' en wat veroorzaakt het?",o:["Een type IP-conflict","Een configuratieprobleem waarbij één kant full-duplex en de andere kant half-duplex gebruikt — veroorzaakt collisions en slechte prestaties","Een type VLAN-conflict","Een type STP-probleem"],c:[1],h:"Duplex mismatch = de meest voorkomende performance-oorzaak op schakellinks. Stel duplex altijd expliciet in."},
{type:"mc",q:"Wat is een 'speed mismatch' op een switch-poort?",o:["Twee switches met verschillende modellen","Wanneer beide kanten van een link verschillende snelheden proberen te gebruiken — de verbinding komt niet op of werkt slecht","Een type duplex-probleem","Een type VLAN-conflict"],c:[1],h:"Speed mismatch = geen verbinding of terugval naar lagere snelheid. Zet speed en duplex altijd handmatig."},
